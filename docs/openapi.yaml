openapi: 3.0.3
info:
  title: CryptoBingo Gateway API
  description: |
    API REST do api-gateway. Autenticação por assinatura de carteira (ADR-006),
    geração de cartelas (ADR-001), salas (ADR-010), drop vault (ADR-011),
    compliance (Lei 14.790/2023, ADR-005) e administração (ADR-009).
  version: 2.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Desenvolvimento Local (api-gateway porta 3000)

tags:
  - name: Auth
  - name: Profile
  - name: Tickets
  - name: Rooms
  - name: Statistics
  - name: Drop Vault
  - name: Player
  - name: NFTs
  - name: Admin
  - name: Sponsors
  - name: Leaderboard
  - name: News
  - name: Content
  - name: Prizes

paths:

  # ══════════════════════════════════════════
  # HEALTH
  # ══════════════════════════════════════════
  /health:
    get:
      summary: Gateway operacional
      tags: [Auth]
      responses:
        '200':
          description: Online
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "Gateway Online" }
                  timestamp: { type: string, format: date-time }

  /games/{gameId}/prizes:
    get:
      summary: Histórico de prêmios de um jogo (público)
      tags: [Prizes]
      description: |
        Retorna todas as transações de prêmio pagas em um jogo.
        Sem autenticação — dados públicos na blockchain.
        Usado por ReplaySummary e GameRoom (archived) para preencher
        prizeStatuses via hydratePrizeStatuses.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Lista de transações de prêmio
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PrizeTx' }
                  total: { type: integer }
                  gameId: { type: string }
        '404':
          description: Jogo não encontrado

  # ══════════════════════════════════════════
  # AUTENTICAÇÃO — Challenge-Response (ADR-006)
  # ══════════════════════════════════════════
  /auth/challenge:
    post:
      summary: Solicita nonce para assinatura (passo 1 do login)
      tags: [Auth]
      description: |
        Gera nonce efêmero (256 bits) com TTL 5min no PostgreSQL.
        O cliente assina SHA256(nonce) com a chave Antelope (permissão active).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet]
              properties:
                wallet: { type: string, example: "jogador1" }
      responses:
        '200':
          description: Nonce gerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeResponse' }
        '400':
          description: Wallet ausente ou inválida

  /auth/verify:
    post:
      summary: Verifica assinatura e emite JWT (passo 2 do login)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet, nonce, signature]
              properties:
                wallet: { type: string }
                nonce: { type: string }
                signature: { type: string, description: "SIG_K1_..." }
      responses:
        '200':
          description: JWT emitido (24h de validade)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  wallet: { type: string }
        '401':
          description: Assinatura inválida

  /auth/logout:
    post:
      summary: Revoga token atual (blacklist Redis)
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Token revogado
        '401':
          description: Token ausente

  # ══════════════════════════════════════════
  # PERFIL
  # ══════════════════════════════════════════
  /profile:
    get:
      summary: Retorna perfil do jogador autenticado
      tags: [Profile]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Perfil completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Token inválido
        '404':
          description: Perfil não encontrado
    put:
      summary: Atualiza preferências do jogador (locale, avatar, etc.)
      tags: [Profile]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum: [en-US, pt-BR, es-ES, fr-FR, ru-RU, zh-CN, ja-JP]
      responses:
        '200':
          description: Preferências atualizadas
        '401':
          description: Token inválido

  # ══════════════════════════════════════════
  # CARTELAS (ADR-001)
  # ══════════════════════════════════════════
  /games/{gameId}/tickets/generate:
    post:
      summary: Gera N cartelas assinadas para buytickets() on-chain
      tags: [Tickets]
      description: |
        Fisher-Yates por coluna BINGO, dedupe via Redis, assinatura ECDSA K1.
        Ref: ADR-001, SPEC.md §3.1.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
          example: "1780000000000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  example: 3
      responses:
        '200':
          description: Cartelas geradas e assinadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateTicketsResponse' }
        '400':
          description: Parâmetros inválidos
        '401':
          description: Token inválido
        '404':
          description: Jogo não encontrado
        '409':
          description: Jogo não está em funding

  # ══════════════════════════════════════════
  # SALAS (ADR-010)
  # ══════════════════════════════════════════
  /rooms:
    get:
      summary: Lista todas as salas ativas (on-chain + metadata MongoDB)
      tags: [Rooms]
      responses:
        '200':
          description: Lista de salas enriquecidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items: { $ref: '#/components/schemas/EnrichedRoom' }
    post:
      summary: Cria uma nova sala (admin)
      tags: [Rooms]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomRequest' }
      responses:
        '201':
          description: Sala criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichedRoom' }
        '401':
          description: Token inválido
        '403':
          description: Sem permissão (requer admin)

  /rooms/{roomId}:
    get:
      summary: Detalhes de uma sala específica
      tags: [Rooms]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichedRoom' }
        '404':
          description: Sala não encontrada

  /rooms/{roomId}/metadata:
    put:
      summary: Atualiza metadados off-chain da sala (nome, descrição, drops)
      tags: [Rooms]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomMetadataInput' }
      responses:
        '200':
          description: Metadados atualizados
        '401':
          description: Token inválido
        '403':
          description: Sem permissão

  /rooms/{roomId}/settings:
    put:
      summary: Atualiza configurações on-chain da sala (max_tickets, drop_chance, difficulty, preços)
      tags: [Rooms]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_tickets_per_player: { type: integer }
                room_drop_chance_bps: { type: integer, minimum: 0, maximum: 10000 }
                difficulty: { type: integer, minimum: 1 }
                ticket_price_min_quantity: { type: integer, description: "Quantidade do preço mínimo (ex: 10000 para 1.0000)" }
                ticket_price_min_contract: { type: string, description: "Contract do token do preço mínimo" }
                ticket_price_max_quantity: { type: integer }
                ticket_price_max_contract: { type: string }
                ticket_price_default_quantity: { type: integer }
                ticket_price_default_contract: { type: string }
      responses:
        '200':
          description: Configurações atualizadas
        '401':
          description: Não autenticado (JWT ausente/inválido)
        '500':
          description: Erro de assinatura/envio on-chain

  /rooms/{roomId}/activate:
    post:
      summary: Ativa a sala (inactive/paused → active)
      tags: [Rooms]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sala ativada
        '400':
          description: Estado inválido para ativação

  /rooms/{roomId}/pause:
    post:
      summary: Pausa a sala (active → paused)
      tags: [Rooms]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sala pausada

  /rooms/{roomId}/close:
    post:
      summary: Fecha a sala permanentemente
      tags: [Rooms]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sala fechada
        '400':
          description: Sala possui jogo ativo — não pode fechar

  # ══════════════════════════════════════════
  # SPONSOR
  # ══════════════════════════════════════════
  /sponsor/rooms:
    get:
      summary: Lista as salas do sponsor autenticado
      tags: [Sponsors]
      security: [{ BearerAuth: [] }]
      description: Filtrado server-side pelo campo `sponsor` da conta autenticada.
      responses:
        '200':
          description: Salas do sponsor
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items: { $ref: '#/components/schemas/EnrichedRoom' }
        '401':
          description: Token inválido

  /sponsors/campaigns:
    get:
      summary: Lista campanhas B2B ativas
      tags: [Sponsors]
      responses:
        '200':
          description: Lista de campanhas
    post:
      summary: Cria campanha de patrocínio
      tags: [Sponsors]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_name, sponsor_pool_amount]
              properties:
                campaign_name: { type: string }
                sponsor_pool_amount: { type: string, example: "5000.0000 WAX" }
      responses:
        '201':
          description: Campanha registrada

  # ══════════════════════════════════════════
  # STATISTICS / COMPLIANCE (Lei 14.790/2023)
  # ══════════════════════════════════════════
  /statistics/rtp:
    get:
      summary: Relatório de RTP/GGR agregado (compliance)
      tags: [Statistics]
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
        - name: currency
          in: query
          schema: { type: string, default: "WAX" }
      responses:
        '200':
          description: Relatório de compliance
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  total_games: { type: integer }
                  total_wagered: { type: number }
                  total_paid_out: { type: number }
                  avg_rtp_display: { type: string, example: "85.00%" }
                  avg_ggr_display: { type: string, example: "15.00%" }
                  currency: { type: string }
                  generated_at: { type: string, format: date-time }

  /statistics/games:
    get:
      summary: Lista jogos recentes com RTPs individuais (auditores)
      tags: [Statistics]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Jogos recentes com dados de compliance
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        game_id: { type: string }
                        status: { type: string }
                        total_wagered: { type: number }
                        total_paid_out: { type: number }
                        rtp_pct: { type: number }
                        resolved_at: { type: string, format: date-time }
                  count: { type: integer }

  /statistics/games/batch:
    get:
      summary: Estatísticas de compliance para um conjunto de game_ids (público)
      tags: [Statistics]
      description: |
        Best-effort — retorna apenas jogos sincronizados no ledger PostgreSQL.
        Jogos não sincronizados são omitidos da resposta.
      parameters:
        - name: gameIds
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated list of game IDs
            example: "1780000000001,1780000000002"
      responses:
        '200':
          description: Stats por game_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        totalTickets: { type: integer }
                        totalWagered: { type: number }
                        totalPaidOut: { type: number }
                        rtpPct: { type: number }

  /statistics/summary:
    get:
      summary: Resumo agregado da plataforma (multi-token, ADR-055)
      description: >
        Retorna total_games/total_players globais + desagregação por token
        (WAX, BINGO, etc). total_prizes vem do transactions_ledger (claim_win),
        avg_rtp_pct de games_history. Público, sem autenticação.
      tags: [Statistics]
      responses:
        '200':
          description: Resumo multi-token
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      total_games:   { type: integer }
                      total_players: { type: integer }
                    required: [total_games, total_players]
                  by_token:
                    type: array
                    items:
                      type: object
                      properties:
                        token:         { type: string, example: "WAX" }
                        total_games:   { type: integer }
                        total_prizes:  { type: number }
                        avg_rtp_pct:   { type: number }
                        total_players: { type: integer }
                      required: [token, total_games, total_prizes, avg_rtp_pct, total_players]
                  generated_at:
                    type: string
                    format: date-time
                required: [totals, by_token, generated_at]

  # ══════════════════════════════════════════
  # PLAYER — Winnings
  # ══════════════════════════════════════════
  /player/winnings/{gameId}:
    get:
      summary: Total ganho pelo jogador autenticado em um jogo específico
      tags: [Player]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ganhos do jogador
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_id: { type: string }
                  wallet: { type: string }
                  total_won: { type: number }
                  currency: { type: string }
        '401':
          description: Token inválido

  /player/winnings/batch:
    post:
      summary: Ganhos do jogador em múltiplos jogos
      tags: [Player]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameIds]
              properties:
                gameIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Mapa gameId → total ganho
          content:
            application/json:
              schema:
                type: object
                properties:
                  winnings:
                    type: object
                    additionalProperties: { type: number }
        '401':
          description: Token inválido

  # ══════════════════════════════════════════
  # NFTs
  # ══════════════════════════════════════════
  /nfts/my-assets:
    get:
      summary: Lista NFTs AtomicAssets do jogador autenticado (cache MongoDB 5min)
      tags: [NFTs]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: NFTs do jogador
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet: { type: string }
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        asset_id: { type: string }
                        schema_name: { type: string }
                        name: { type: string }
                        backed_tokens: { type: string, example: "10000.0000 BINGO" }
        '401':
          description: Token inválido

  # ══════════════════════════════════════════
  # ADMINISTRAÇÃO (ADR-009)
  # ══════════════════════════════════════════
  /admin/users:
    get:
      summary: Lista usuários (admin)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Lista de usuários
        '403':
          description: Sem permissão

  /admin/patterns:
    get:
      summary: Lista padrões de vitória on-chain (ADR-004)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Lista de padrões
    post:
      summary: Cria ou atualiza padrão de vitória
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternInput' }
      responses:
        '201':
          description: Padrão criado

  /admin/patterns/{patternId}:
    delete:
      summary: Remove padrão de vitória
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: patternId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Padrão removido

  /admin/gametypes:
    get:
      summary: Lista game types configurados (ADR-004)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Lista de game types
    post:
      summary: Cria novo game type
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_multiplier]
              properties:
                name: { type: string }
                base_multiplier: { type: integer, minimum: 1 }
                max_balls: { type: integer, default: 75 }
                draw_mode:
                  type: string
                  enum: [standard, fixed, firstfull, goldenball, multimatch]
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      pattern_id: { type: string }
                      weight: { type: integer, description: "Hundredths (200 = 2.00×)" }
      responses:
        '201':
          description: Game type criado

  /admin/gametypes/{gametypeId}:
    delete:
      summary: Remove game type
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gametypeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Game type removido
    put:
      summary: Atualiza game type on-chain (addgametype)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gametypeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGametypeRequest' }
      responses:
        '200':
          description: Game type atualizado on-chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  gametype_id: { type: string }
                  transaction_id: { type: string }
        '400':
          description: Campos obrigatórios ausentes ou inválidos

  /admin/gametypes/{gametypeId}/stages:
    put:
      summary: Define estágios progressivos MULTI_MATCH (ADR-013)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gametypeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stages]
              properties:
                stages:
                  type: array
                  items: { $ref: '#/components/schemas/StageRule' }
      responses:
        '200':
          description: Estágios atualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  transaction_id: { type: string }
        '400':
          description: stages inválido

  /admin/gametypes/{gametypeId}/metadata:
    get:
      summary: Retorna metadata off-chain do game type (combinações, regras estendidas)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gametypeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Metadata do game type
          content:
            application/json:
              schema:
                type: object
                properties:
                  combinations:
                    type: array
                    items: { type: object }
                  rules:
                    type: array
                    items: { type: object }
    put:
      summary: Persiste metadata off-chain do game type (combinações, regras estendidas)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gametypeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                combinations:
                  type: array
                  items: { type: object }
                rules:
                  type: array
                  items: { type: object }
      responses:
        '200':
          description: Metadata salva

  /admin/simulate-weights:
    post:
      summary: Simulação Monte Carlo para validação de pesos (ADR-005)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateWeightsRequest' }
      responses:
        '200':
          description: Resultado da simulação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '400':
          description: Parâmetros inválidos

  /admin/calibrate-weights:
    post:
      summary: Calibração iterativa de pesos até atingir RTP alvo (ADR-005)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalibrateWeightsRequest' }
      responses:
        '200':
          description: Pesos calibrados com RTP atingido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalibrateWeightsResult' }

  /admin/suggest-combos:
    post:
      summary: Geração e precificação inteligente de combinações (ADR-016)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      description: |
        4 fases: descoberta de hit_rates → geração hierárquica de combos →
        precificação por dificuldade → validação Monte Carlo. Os pesos dos
        patterns NÃO são modificados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestCombosRequest' }
      responses:
        '200':
          description: Combos gerados e validados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestCombosResult' }

  /admin/ledger/sync:
    post:
      summary: Sincroniza um jogo on-chain com o ledger PostgreSQL (admin)
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      description: |
        Útil para reprocessar jogos ou popular o ledger retroativamente.
        O ledger é a fonte de verdade para compliance (Lei 14.790/2023).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameId]
              properties:
                gameId: { type: string }
      responses:
        '200':
          description: Jogo sincronizado
        '404':
          description: Jogo não encontrado on-chain

  # ══════════════════════════════════════════
  # SWAP QUOTE — ADR-021 (Checkout Multi-Moeda)
  # ══════════════════════════════════════════
  /swap/pools:
    get:
      summary: Lista pools ativas do bingogameswp
      description: >
        Retorna pools AMM ativas com reservas e taxas. Cache de 10s no servidor.
        Usado pelo BuyTicketModal para filtrar tokens alternativos disponíveis.
      tags: [Swap]
      parameters: []
      responses:
        '200':
          description: Lista de pools
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/SwapPoolSummary'
        '502':
          description: Falha ao ler pools do nodeos

  /swap/quote:
    get:
      summary: Cotação para swap de moeda alternativa na compra de cartelas
      description: >
        Dado o custo total em moeda da sala (`amount_out`) e um par de tokens,
        calcula quantos tokens alternativos o usuário precisa enviar (`amount_in`)
        usando a fórmula reverse AMM: considera `fee_bps` (LP) e `service_fee_bps`.
        TTL limitado por `min(30s, game_end_time - now - 5s)`.
        A transação é construída e assinada pelo cliente via Wharfkit — este endpoint
        é somente-leitura e não custodia fundos.
      tags: [Swap]
      parameters:
        - in: query
          name: from_contract
          required: true
          schema: { type: string }
          description: Contrato do token de origem (ex. "bingogametkn")
        - in: query
          name: from_symbol
          required: true
          schema: { type: string }
          description: Símbolo com precisão (ex. "4,BINGO")
        - in: query
          name: to_contract
          required: true
          schema: { type: string }
          description: Contrato do token de destino
        - in: query
          name: to_symbol
          required: true
          schema: { type: string }
          description: Símbolo com precisão do token de destino
        - in: query
          name: amount_out
          required: true
          schema: { type: string }
          description: Unidades mínimas do token de destino desejado (custo total das cartelas)
        - in: query
          name: game_end_time
          required: false
          schema: { type: integer }
          description: Unix timestamp (segundos) do fim do funding — limita TTL da cotação
      responses:
        '200':
          description: Cotação calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuote'
        '400':
          description: Parâmetros obrigatórios ausentes ou amount_out inválido
        '404':
          description: Par de tokens sem pool disponível
        '422':
          description: Liquidez insuficiente para o volume solicitado
        '502':
          description: Falha ao ler estado do nodeos

  # ══════════════════════════════════════════
  # DROP VAULT (ADR-011)
  # ══════════════════════════════════════════
  /vault/deposits:
    get:
      summary: Lista depósitos do vault do usuário autenticado
      tags: [Drop Vault]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Lista de depósitos
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposits:
                    type: array
                    items: { $ref: '#/components/schemas/DropDeposit' }

  /vault/deposits/{depositId}:
    get:
      summary: Detalhe de um depósito
      tags: [Drop Vault]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Depósito encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DropDeposit' }
        '404':
          description: Depósito não encontrado

  /vault/allocations:
    get:
      summary: Lista alocações ativas
      tags: [Drop Vault]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: roomId
          in: query
          schema: { type: string }
          description: Filtrar por sala
      responses:
        '200':
          description: Lista de alocações
          content:
            application/json:
              schema:
                type: object
                properties:
                  allocations:
                    type: array
                    items: { $ref: '#/components/schemas/DropAllocation' }

  /vault/allocate:
    post:
      summary: Aloca ativo do vault a uma sala
      tags: [Drop Vault]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deposit_id, room_id, drop_chance_bps]
              properties:
                deposit_id: { type: string }
                room_id: { type: string }
                quantity_per_drop: { type: string, example: "10.0000 WAX" }
                nft_asset_id: { type: string }
                drop_chance_bps: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: Alocação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  transaction_id: { type: string }

  /vault/deallocate:
    post:
      summary: Remove alocação de uma sala
      tags: [Drop Vault]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alloc_id]
              properties:
                alloc_id: { type: string }
      responses:
        '200':
          description: Alocação removida

  /vault/reclaim:
    post:
      summary: Reclama ativo não alocado do vault (saque)
      tags: [Drop Vault]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deposit_id]
              properties:
                deposit_id: { type: string }
      responses:
        '200':
          description: Ativo reclaimado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  transaction_id: { type: string }

  # ══════════════════════════════════════════
  # LEADERBOARD (ADR-024)
  # ══════════════════════════════════════════
  /leaderboard:
    get:
      summary: Top vencedores global
      description: >
        Ranking dos maiores vencedores de toda a plataforma, agregado sobre
        `transactions_ledger` (action_type = 'claim_win'). Sem autenticação.
        Cache Redis 5 min. Máx 50 entradas.
      tags: [Leaderboard]
      parameters:
        - in: query
          name: currency
          required: false
          schema: { type: string, example: "WAX" }
          description: Filtra por moeda (WAX, BINGO, TLM…). Omitir = todos.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: Número de entradas retornadas (máx 50)
      responses:
        '200':
          description: Ranking global
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  cached_at: { type: string, format: date-time }
                  currency_filter: { type: string, nullable: true }

  /leaderboard/rooms/{roomId}:
    get:
      summary: Top vencedores por sala
      description: >
        Ranking dos maiores vencedores em uma sala específica.
        Sem autenticação. Cache Redis 5 min. Máx 20 entradas.
      tags: [Leaderboard]
      parameters:
        - in: path
          name: roomId
          required: true
          schema: { type: string }
          description: ID da sala (uint64 como string)
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Ranking da sala
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id: { type: string }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  cached_at: { type: string, format: date-time }
        '404':
          description: Sala não encontrada

  # ══════════════════════════════════════════
  # NEWS / PROMOÇÕES (ADR-024)
  # ══════════════════════════════════════════
  /news:
    get:
      summary: Lista publicações ativas
      description: >
        Retorna publicações ativas ordenadas por `published_at` desc.
        Publicações `pinned=true` aparecem primeiro independentemente da data.
        Sem autenticação. Cache Redis 2 min.
      tags: [News]
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista de publicações
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NewsItem' }
                  total: { type: integer }
                  cached_at: { type: string, format: date-time }
    post:
      summary: Cria publicação (admin)
      tags: [News]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsItemInput' }
      responses:
        '201':
          description: Publicação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItem' }
        '400':
          description: Payload inválido
        '401':
          description: Não autenticado
        '403':
          description: Apenas admins

  /news/{id}:
    patch:
      summary: Edita publicação (admin)
      tags: [News]
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsItemInput' }
      responses:
        '200':
          description: Publicação atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItem' }
        '403':
          description: Apenas admins
        '404':
          description: Publicação não encontrada
    delete:
      summary: Remove publicação (admin — soft delete)
      tags: [News]
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Publicação arquivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          description: Apenas admins
        '404':
          description: Publicação não encontrada

  # ══════════════════════════════════════════
  # CONTENT (ADR-037)
  # ══════════════════════════════════════════
  /content/{type}:
    get:
      summary: Listar conteúdo por tipo
      description: Retorna conteúdo ativo de um tipo (faq, howitworks, sponsors, tutorials, news). Cache Redis 2min.
      tags: [Content]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [faq, howitworks, sponsors, tutorials, news]
          description: Tipo de conteúdo
      responses:
        '200':
          description: Lista de itens de conteúdo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentItem'
                  total:
                    type: integer
                  type:
                    type: string
    post:
      summary: Criar item de conteúdo (admin)
      tags: [Content, Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentInput'
      responses:
        '201':
          description: Item criado

  /content/{type}/{id}:
    get:
      summary: Obter item de conteúdo por ID
      tags: [Content]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item de conteúdo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
    patch:
      summary: Atualizar item de conteúdo (admin)
      tags: [Content, Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentInput'
      responses:
        '200':
          description: Item atualizado
    delete:
      summary: Remover item de conteúdo (admin, soft delete)
      tags: [Content, Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removido

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por /auth/verify. Prazo 24h. Payload contém { wallet }.

  schemas:

    ChallengeResponse:
      type: object
      properties:
        nonce:
          type: string
          description: 256 bits hex — assinar como SHA256(nonce)
          example: "a3f9c2d1b4e8f27c9031ab45cd67ef89..."
        expires_at:
          type: string
          format: date-time
          description: TTL de 5 minutos
        message:
          type: string
          example: "Assine este nonce com a permissão active."

    GenerateTicketsResponse:
      type: object
      properties:
        game_id: { type: string }
        account: { type: string }
        count: { type: integer }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/SignedTicket' }

    SignedTicket:
      type: object
      properties:
        matrix:
          type: array
          items: { type: integer, minimum: 1, maximum: 75 }
          minItems: 24
          maxItems: 24
          description: |
            24 números coluna-major: [B0-B4, I0-I4, N0,N1,N3,N4, G0-G4, O0-O4].
            Posição 12 (FREE SPACE) omitida. Ref: SPEC.md §1.3.
        signature:
          type: string
          description: "SIG_K1_... — ECDSA K1 de SHA256(matrix+game_id+account)."

    UserProfile:
      type: object
      properties:
        wallet_address: { type: string }
        nickname: { type: string }
        avatar_nft_asset_id: { type: string, nullable: true }
        preferences:
          type: object
          properties:
            locale: { type: string, enum: [en-US, pt-BR, es-ES, fr-FR, ru-RU, zh-CN, ja-JP] }
            sound_enabled: { type: boolean }
        progression:
          type: object
          properties:
            xp: { type: integer }
            tier:
              type: string
              enum: [Cobre, Bronze, Prata, Ouro, Platina, Esmeralda, Safira, Rubi, Diamante]
            level: { type: integer }
            sub_level: { type: integer }
            games_played: { type: integer }
            next_level_xp: { type: integer }
            xp_to_next_level: { type: integer }
            progress_pct: { type: integer }

    ExtendedAsset:
      type: object
      description: extended_asset on-chain serializado pelo nó Antelope
      properties:
        quantity: { type: string, example: "10.0000 WAX" }
        contract: { type: string, example: "eosio.token" }

    EnrichedRoom:
      type: object
      description: Sala on-chain enriquecida com metadata MongoDB (ADR-010)
      properties:
        room_id: { type: string }
        sponsor: { type: string }
        gametype_id: { type: string }
        currency: { $ref: '#/components/schemas/ExtendedAsset' }
        ticket_price_min: { $ref: '#/components/schemas/ExtendedAsset' }
        ticket_price_max: { $ref: '#/components/schemas/ExtendedAsset' }
        ticket_price_default: { $ref: '#/components/schemas/ExtendedAsset' }
        weight: { type: integer }
        max_tickets_per_player: { type: integer }
        current_game_id: { type: string }
        room_drop_chance_bps: { type: integer }
        status: { type: string, enum: [inactive, active, paused, closed] }
        metadata:
          type: object
          nullable: true
          properties:
            name: { type: string }
            description: { type: string }
            chat_enabled: { type: boolean }
            auto_start_delay_sec: { type: integer }
            drops:
              type: array
              items: { $ref: '#/components/schemas/RoomDropConfig' }

    CreateRoomRequest:
      type: object
      required: [room_id, gametype_id, currency_quantity, currency_contract]
      properties:
        room_id: { type: string }
        sponsor: { type: string }
        gametype_id: { type: string }
        currency_quantity: { type: string, example: "0.0000 WAX" }
        currency_contract: { type: string, example: "eosio.token" }
        ticket_price_min: { type: string }
        ticket_price_max: { type: string }
        ticket_price_default: { type: string }
        max_tickets_per_player: { type: integer }
        name: { type: string }
        description: { type: string }
        auto_start_delay_sec: { type: integer, default: 30 }
        chat_enabled: { type: boolean, default: true }

    RoomMetadataInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        cover_image_url: { type: string }
        rules_summary: { type: string }
        chat_enabled: { type: boolean }
        auto_start_delay_sec: { type: integer }
        drops:
          type: array
          items: { $ref: '#/components/schemas/RoomDropConfig' }

    RoomDropConfig:
      type: object
      properties:
        token_contract: { type: string }
        symbol: { type: string }
        amount: { type: string }
        template_id: { type: integer }
        collection_name: { type: string }
        drop_chance_pct: { type: number, minimum: 0, maximum: 100 }
        max_drops_per_game: { type: integer }

    PatternInput:
      type: object
      required: [name, mask]
      properties:
        name: { type: string, example: "full_house" }
        mask: { type: integer, description: "uint64 bitmask (25 bits usados)", example: 33554431 }
        weight: { type: integer, description: "Hundredths — 200 = 2.00×", example: 1000 }

    DropDeposit:
      type: object
      description: Depósito de ativo no vault on-chain (ADR-011)
      properties:
        deposit_id: { type: string }
        owner: { type: string }
        asset_type: { type: string, enum: [token, nft] }
        token_contract: { type: string }
        token_symbol: { type: string }
        quantity_original: { $ref: '#/components/schemas/ExtendedAsset' }
        quantity_remaining: { $ref: '#/components/schemas/ExtendedAsset' }
        nft_asset_id: { type: string }
        nft_template_id: { type: integer }
        nft_collection: { type: string }
        status: { type: string, enum: [deposited, active, draining, exhausted, reclaimed] }
        deposited_at: { type: integer, description: "Unix timestamp (seconds)" }

    DropAllocation:
      type: object
      description: Alocação de ativo de uma sala específica (ADR-011)
      properties:
        alloc_id: { type: string }
        deposit_id: { type: string }
        owner: { type: string }
        room_id: { type: string }
        asset_type: { type: string, enum: [token, nft] }
        token_contract: { type: string }
        token_symbol: { type: string }
        quantity_per_drop: { $ref: '#/components/schemas/ExtendedAsset' }
        quantity_distributed: { $ref: '#/components/schemas/ExtendedAsset' }
        nft_asset_id: { type: string }
        nft_template_id: { type: integer }
        nft_collection: { type: string }
        drop_chance_bps: { type: integer, description: "1–10000 (100 = 1%)" }
        drops_executed: { type: integer }
        status: { type: string, enum: [active, deallocated, exhausted] }
        allocated_at: { type: integer, description: "Unix timestamp (seconds)" }

    SimulateWeightsRequest:
      type: object
      required: [gametype_name, base_multiplier, patterns]
      properties:
        gametype_name: { type: string }
        base_multiplier: { type: integer, minimum: 1 }
        patterns:
          type: array
          items:
            type: object
            required: [name, mask, weight]
            properties:
              pattern_id: { type: integer }
              name: { type: string }
              mask: { type: integer }
              weight: { type: integer, minimum: 1 }
        simulations: { type: integer, minimum: 1, maximum: 100000, default: 10000 }
        tickets_per_game: { type: integer, minimum: 1, maximum: 500, default: 100 }
        ticket_price: { type: number, default: 10 }

    SimulationResult:
      type: object
      properties:
        gametype_name: { type: string }
        simulations: { type: integer }
        tickets_per_game: { type: integer }
        ticket_price: { type: number }
        base_multiplier: { type: integer }
        rtp: { type: number, example: 0.8532 }
        rtp_pct: { type: string, example: "85.3200%" }
        ggr: { type: number, example: 0.1468 }
        ggr_pct: { type: string, example: "14.6800%" }
        total_wagered: { type: number }
        total_paid_out: { type: number }
        avg_payout_per_game: { type: number }
        avg_winners_per_game: { type: number }
        is_viable: { type: boolean }
        alerts: { type: array, items: { type: string } }
        pattern_stats:
          type: array
          items:
            $ref: '#/components/schemas/PatternStats'
        duration_ms: { type: integer }
        computed_at: { type: string, format: date-time }

    PatternStats:
      type: object
      properties:
        name: { type: string }
        mask: { type: integer }
        weight: { type: integer }
        hit_count: { type: integer }
        hit_rate: { type: number }
        avg_balls_needed: { type: number }

    UpdateGametypeRequest:
      type: object
      required: [name, base_multiplier, rules]
      properties:
        name: { type: string, example: "Bingo Clássico" }
        base_multiplier: { type: integer, minimum: 1, maximum: 255, example: 5 }
        rules:
          type: array
          items:
            type: object
            required: [pattern_id, weight]
            properties:
              pattern_id: { type: string }
              weight: { type: integer, minimum: 100, maximum: 25500, description: "Hundredths (100 = 1.00×, 25500 = 255.00×)" }
        draw_mode:
          type: string
          enum: [standard, fixed, firstfull, goldenball, multimatch]
          default: standard
        max_balls: { type: integer, default: 0, description: "0 = padrão (35)" }
        golden_ball_after: { type: integer, default: 0 }
        master_weight_ovrd: { type: integer, default: 0, description: "Hundredths — FIRST_FULL override" }

    StageRule:
      type: object
      required: [stage, patterns_required, weight]
      properties:
        stage: { type: integer, description: "Nº do estágio (1, 2, 3…)" }
        patterns_required: { type: integer, description: "Qtd de padrões p/ vencer este estágio" }
        weight: { type: integer, description: "Hundredths (100 = 1.00×, max 25500)" }

    CalibrateWeightsRequest:
      type: object
      required: [gametype_name, base_multiplier, patterns]
      properties:
        gametype_name: { type: string }
        base_multiplier: { type: integer, minimum: 1 }
        patterns:
          type: array
          items: { $ref: '#/components/schemas/PatternRuleInput' }
        combinations:
          type: array
          items: { $ref: '#/components/schemas/CombinationRuleInput' }
        tickets_per_game: { type: integer, default: 100 }
        ticket_price: { type: number, default: 10 }
        max_balls: { type: integer, description: "Limite de bolas (1-75)" }
        target_rtp: { type: number, default: 0.85 }
        discovery_sims: { type: integer, default: 20000 }
        alpha: { type: number, default: 0.1 }
        tolerance: { type: number, default: 0.005 }
        max_iter: { type: integer, default: 300 }
        validation_sims: { type: integer, default: 10000 }

    CalibrateWeightsResult:
      type: object
      properties:
        gametype_name: { type: string }
        target_rtp: { type: number }
        algebraic_rtp: { type: number }
        algebraic_rtp_pct: { type: string }
        iterations: { type: integer }
        converged: { type: boolean }
        validation_sims: { type: integer }
        validation_rtp: { type: number }
        validation_rtp_pct: { type: string }
        pattern_weights: { type: object, description: "name → hundredths" }
        item_calibrations:
          type: array
          items: { $ref: '#/components/schemas/ItemCalibration' }
        alerts: { type: array, items: { type: string } }
        is_viable: { type: boolean }
        duration_ms: { type: integer }
        computed_at: { type: string, format: date-time }

    ItemCalibration:
      type: object
      properties:
        name: { type: string }
        probability: { type: number }
        weight: { type: integer, description: "Peso calibrado em hundredths" }

    SuggestCombosRequest:
      type: object
      required: [gametype_name, base_multiplier, patterns]
      properties:
        gametype_name: { type: string }
        base_multiplier: { type: integer, minimum: 1 }
        patterns:
          type: array
          items: { $ref: '#/components/schemas/PatternRuleInput' }
        draw_mode:
          type: string
          enum: [standard, fixed, firstfull, goldenball, multimatch]
          default: standard
        tickets_per_game: { type: integer, default: 100 }
        ticket_price: { type: number, default: 10 }
        max_balls: { type: integer }

    SuggestCombosResult:
      type: object
      properties:
        gametype_name: { type: string }
        pattern_weights: { type: object, description: "name → hundredths (inalterados)" }
        combos:
          type: array
          items: { $ref: '#/components/schemas/ComboCandidate' }
        combo_weights: { type: object, description: "combo name → hundredths" }
        validation: { $ref: '#/components/schemas/SimulationResult' }
        is_viable: { type: boolean }
        alerts: { type: array, items: { type: string } }
        duration_ms: { type: integer }
        computed_at: { type: string, format: date-time }

    PatternRuleInput:
      type: object
      required: [name, mask, weight]
      properties:
        pattern_id: { type: [integer, string] }
        name: { type: string }
        mask: { type: integer, description: "uint32 bitmask (25 bits)" }
        weight: { type: integer, description: "Hundredths (100 = 1.00×, 25500 = 255.00×)" }
        pattern_type:
          type: string
          enum: [simple, special, master]
          default: simple

    CombinationRuleInput:
      type: object
      required: [name, weight, clauses]
      properties:
        name: { type: string }
        weight: { type: integer }
        clauses:
          type: array
          items: { $ref: '#/components/schemas/CombinationClauseInput' }

    CombinationClauseInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [all_of, any_of, n_of_type]
        pattern_ids:
          type: array
          items: { type: string }
          description: "IDs dos patterns (usado em all_of / any_of)"
        pattern_type:
          type: string
          description: "Tipo de pattern (usado em n_of_type)"
        count:
          type: integer
          description: "Qtd necessária (usado em n_of_type)"

    ComboCandidate:
      type: object
      properties:
        name: { type: string }
        weight: { type: integer, description: "Peso sugerido em hundredths" }
        clauses:
          type: array
          items: { $ref: '#/components/schemas/CombinationClauseInput' }

    SwapPoolSummary:
      type: object
      description: Pool AMM resumida do bingogameswp (ADR-021)
      properties:
        pool_id:         { type: string, description: "uint64 como string" }
        token_a:
          type: object
          properties:
            contract:  { type: string }
            symbol:    { type: string }
            precision: { type: integer }
        token_b:
          type: object
          properties:
            contract:  { type: string }
            symbol:    { type: string }
            precision: { type: integer }
        reserve_a:       { type: string, description: "int64 como string" }
        reserve_b:       { type: string, description: "int64 como string" }
        fee_bps:         { type: integer, description: "Taxa LP em bps (30 = 0.30%)" }
        service_fee_bps: { type: integer, description: "Taxa de serviço em bps — ADR-019" }

    SwapQuote:
      type: object
      description: Cotação para swap de moeda alternativa (ADR-021)
      properties:
        quote_id:           { type: string, description: "UUID — rastreabilidade" }
        pool_id:            { type: string }
        from_contract:      { type: string }
        from_symbol:        { type: string }
        to_contract:        { type: string }
        to_symbol:          { type: string }
        amount_in:          { type: string, description: "Unidades mínimas a enviar" }
        amount_in_display:  { type: string, description: "Ex: '123.4567 BINGO'" }
        amount_out:         { type: string, description: "Unidades mínimas a receber" }
        amount_out_display: { type: string, description: "Ex: '10.00000000 WAX'" }
        min_out:            { type: string, description: "amount_out com slippage 0.5%" }
        fee_bps:            { type: integer }
        service_fee_bps:    { type: integer }
        price_impact_pct:   { type: number, description: "Impacto no pool em %" }
        expires_at:         { type: integer, description: "Unix timestamp (seconds)" }

    LeaderboardEntry:
      type: object
      description: Entrada no ranking de vencedores (ADR-024)
      properties:
        rank:       { type: integer, description: "Posição no ranking (1-based)" }
        wallet:     { type: string, description: "Conta WAX do jogador" }
        nickname:   { type: string, nullable: true, description: "Apelido do perfil Mongo" }
        total_won:  { type: number, description: "Soma dos claim_win em unidades da moeda" }
        currency:   { type: string, description: "Símbolo da moeda (WAX, BINGO, TLM…)" }
        games_won:  { type: integer, description: "Número de transações claim_win" }
        room_id:    { type: string, nullable: true, description: "Presente só no leaderboard por sala" }

    NewsItem:
      type: object
      description: Publicação de notícia/promoção (ADR-024)
      properties:
        id:               { type: string, description: "ObjectId do MongoDB como string" }
        title:            { type: string }
        content:          { type: string, description: "Markdown ou HTML sanitizado" }
        image_url:        { type: string, nullable: true }
        locale_overrides:
          type: object
          description: "Traduções opcionais por locale"
          properties:
            en-US:
              type: object
              properties:
                title:   { type: string }
                content: { type: string }
            zh-CN:
              type: object
              properties:
                title:   { type: string }
                content: { type: string }
        active:           { type: boolean }
        pinned:           { type: boolean }
        published_at:     { type: string, format: date-time }
        published_by:     { type: string, description: "Wallet do admin que publicou" }

    NewsItemInput:
      type: object
      description: Payload para criar/editar publicação (ADR-024)
      required: [title, content]
      properties:
        title:            { type: string }
        content:          { type: string }
        image_url:        { type: string, nullable: true }
        locale_overrides:
          type: object
          properties:
            en-US:
              type: object
              properties:
                title:   { type: string }
                content: { type: string }
            zh-CN:
              type: object
              properties:
                title:   { type: string }
                content: { type: string }
        active:           { type: boolean, default: true }
        pinned:           { type: boolean, default: false }

    PrizeTx:
      type: object
      description: Transação de prêmio persistida no MongoDB (ADR-038)
      properties:
        game_id:
          type: string
        ticket_id:
          type: string
        win_type:
          type: string
          enum: [pattern, combo, stage]
          description: Tipo de vitória.
        win_label:
          type: string
          description: Rótulo único (ex. "stage_1", "ROW_1"). Chave composta com ticket_id.
        account:
          type: string
          description: Conta WAX do vencedor.
        transaction_id:
          type: string
          description: Hash da transação on-chain.
        amount:
          type: string
          description: Valor do prêmio (ex. "125.0000").
        currency:
          type: string
          description: Símbolo da moeda (ex. "WAX").
        status:
          type: string
          enum: [confirmed]
          description: Status da transação.

    ContentItem:
      type: object
      properties:
        _id:
          type: string
        type:
          type: string
        title:
          type: string
        slug:
          type: string
        content:
          type: string
          description: Texto ou JSON de blocks (BlockNote)
        content_format:
          type: string
          enum: [text, blocks]
        metadata:
          type: object
        image_url:
          type: string
        sort_order:
          type: integer
        pinned:
          type: boolean
        active:
          type: boolean
        locale_overrides:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        content_format:
          type: string
          enum: [text, blocks]
        metadata:
          type: object
        image_url:
          type: string
        sort_order:
          type: integer
        pinned:
          type: boolean
