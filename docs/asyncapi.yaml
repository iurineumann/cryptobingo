asyncapi: 2.6.0
info:
  title: CryptoBingo — WebSocket Event Stream API
  version: 2.0.0
  description: |
    Barramento de eventos em tempo real via Socket.io (ADR-007).
    Suporta Slow Reveal (3s/bola), reconciliação de estado, chat de sala,
    modos de sorteio (ADR-012/013/014) e notificações de drops (ADR-011).

    **Autenticação:** JWT no handshake inicial (header Authorization ou query token).
    **Namespace:** raiz `/` com rooms nomeadas por game_id e room_id.

servers:
  production:
    url: wss://ws.seubingo.com
    protocol: wss
    description: Broadcaster Worker com Socket.io (at-least-once via reconciliação)
    security:
      - jwtAuth: []
  development:
    url: ws://localhost:8085
    protocol: ws
    description: Instância local via Docker Compose

channels:

  # ─────────────────────────────────────────────────────────────────
  # CANAL DE JOGO — eventos de sorteio ao vivo (Slow Reveal)
  # ─────────────────────────────────────────────────────────────────
  game.{game_id}:
    description: |
      Canal por partida. O cliente entra via socket.join(`game:${game_id}`).
      Todos os eventos de sorteio, resultado e estado são emitidos aqui.
    parameters:
      game_id:
        description: Identificador único da partida on-chain (uint64 como string).
        schema:
          type: string
          pattern: '^\d+$'
    subscribe:
      description: Eventos emitidos pelo Broadcaster (Servidor → Cliente).
      message:
        oneOf:
          - $ref: '#/components/messages/GameLocked'
          - $ref: '#/components/messages/BallDrawn'
          - $ref: '#/components/messages/WinnerFound'
          - $ref: '#/components/messages/GameAborted'
          - $ref: '#/components/messages/GameEnded'
          - $ref: '#/components/messages/GoldenBall'
          - $ref: '#/components/messages/StageCleared'
          - $ref: '#/components/messages/SyncResponse'
    publish:
      description: Comandos de controle enviados pelo cliente (Cliente → Servidor).
      message:
        oneOf:
          - $ref: '#/components/messages/SubscribeGame'
          - $ref: '#/components/messages/SyncRequest'

  # ─────────────────────────────────────────────────────────────────
  # CANAL DE SALA — chat e drops (ADR-010 / ADR-011)
  # ─────────────────────────────────────────────────────────────────
  room.{room_id}:
    description: |
      Canal por sala. Usado para mensagens de chat e notificações de drops.
      O cliente entra via socket.join(`room:${room_id}`) ao conectar à sala.
    parameters:
      room_id:
        description: Identificador único da sala on-chain (uint64 como string).
        schema:
          type: string
          pattern: '^\d+$'
    subscribe:
      description: Eventos de sala emitidos pelo Servidor (Servidor → Cliente).
      message:
        oneOf:
          - $ref: '#/components/messages/ChatMessage'
          - $ref: '#/components/messages/SponsorDrop'
    publish:
      description: Mensagens enviadas pelo cliente para a sala (Cliente → Servidor).
      message:
        $ref: '#/components/messages/SendChatMessage'

components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido pelo /auth/verify (ADR-006). Enviado no handshake.

  messages:

    # ──────────────────────────────────────────────────────────────
    # JOGO: SERVIDOR → CLIENTE
    # ──────────────────────────────────────────────────────────────

    GameLocked:
      name: game_locked
      title: Partida Bloqueada
      summary: FSM transitou FUNDING → LOCKED. Novas compras bloqueadas.
      payload:
        type: object
        required: [event, game_id, timestamp]
        properties:
          event:
            type: string
            const: game_locked
          game_id:
            type: string
          timestamp:
            type: string
            format: date-time

    BallDrawn:
      name: ball_drawn
      title: Bola Sorteada (Slow Reveal — ADR-007)
      summary: |
        Emitido a cada ~3s durante o sorteio.
        O campo `order` é usado para detecção de perda de pacotes e reconciliação.
      payload:
        type: object
        required: [event, game_id, payload]
        properties:
          event:
            type: string
            const: ball_drawn
          game_id:
            type: string
          payload:
            type: object
            required: [order, number, timestamp]
            properties:
              order:
                type: integer
                description: Posição ordinal (1..max_balls). Vital para reconciliação.
              number:
                type: integer
                minimum: 1
                maximum: 75
              timestamp:
                type: string
                format: date-time

    WinnerFound:
      name: winner_found
      title: Vencedores Detectados
      summary: Emitido após identificação de vencedores pelo evaluator.
      payload:
        type: object
        required: [event, game_id, payload]
        properties:
          event:
            type: string
            const: winner_found
          game_id:
            type: string
          payload:
            type: object
            required: [winners]
            properties:
              winning_ball:
                type: integer
                description: Bola que completou o padrão (pode ser null em multi-match).
                nullable: true
              mode:
                type: string
                enum: [fixed, firstfull, goldenball, multimatch, standard]
              winners:
                type: array
                items:
                  $ref: '#/components/schemas/WinnerObject'

    GameAborted:
      name: game_aborted
      title: Partida Abortada (Fail-Safe)
      summary: |
        FSM transitou para ABORTED. Cartelas serão reembolsadas automaticamente.
        O cliente deve cancelar animações e exibir tela de estorno.
      payload:
        type: object
        required: [event, game_id, payload]
        properties:
          event:
            type: string
            const: game_aborted
          game_id:
            type: string
          payload:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                enum: [ORACLE_TIMEOUT, LOW_QUORUM, ADMIN_HALT]

    GameEnded:
      name: game_ended
      title: Partida Encerrada (ADR-014)
      summary: |
        Emitido após processamento completo de claimwin + closegame.
        Indica que o Slow Reveal pode ser finalizado e o UI de resultado exibido.
      payload:
        type: object
        required: [event, game_id, payload]
        properties:
          event:
            type: string
            const: game_ended
          game_id:
            type: string
          payload:
            type: object
            required: [mode, total_winners]
            properties:
              mode:
                type: string
                enum: [fixed, firstfull, goldenball, multimatch, standard]
              total_winners:
                type: integer
              total_paid_out:
                type: string
                description: Total pago em formato "X.XXXX SYMBOL" (opcional).
                nullable: true

    GoldenBall:
      name: golden_ball
      title: Bola Dourada Ativada (ADR-012)
      summary: |
        Exclusivo do modo goldenball. Emitido quando a bola extra com multiplicador
        é sorteada além das N bolas padrão.
      payload:
        type: object
        required: [event, game_id, payload]
        properties:
          event:
            type: string
            const: golden_ball
          game_id:
            type: string
          payload:
            type: object
            required: [ball_num, multiplier]
            properties:
              ball_num:
                type: integer
                description: Número da bola dourada (1–75).
              multiplier:
                type: integer
                description: Multiplicador de prêmio (ex. 2 = 2×).

    StageCleared:
      name: stage_cleared
      title: Estágio Completado (ADR-013)
      summary: |
        Exclusivo do modo multimatch. Emitido quando um conjunto de padrões
        é completado, liberando o prêmio do estágio.
      payload:
        type: object
        required: [event, game_id, payload]
        properties:
          event:
            type: string
            const: stage_cleared
          game_id:
            type: string
          payload:
            type: object
            required: [stage, winners]
            properties:
              stage:
                type: integer
                description: Número do estágio (1-based).
              winners:
                type: array
                items:
                  $ref: '#/components/schemas/WinnerObject'

    SyncResponse:
      name: sync_response
      title: Resposta de Reconciliação
      summary: |
        Resposta ao SyncRequest do cliente. Contém todas as bolas já emitidas
        desde o início (ou desde last_order) para reconstrução do estado.
      payload:
        type: object
        required: [event, game_id, balls, current_index]
        properties:
          event:
            type: string
            const: sync_response
          game_id:
            type: string
          balls:
            type: array
            items:
              type: object
              required: [order, number, timestamp]
              properties:
                order:
                  type: integer
                number:
                  type: integer
                timestamp:
                  type: string
                  format: date-time
          current_index:
            type: integer
            description: Índice atual do Slow Reveal (quantas bolas já foram reveladas).

    # ──────────────────────────────────────────────────────────────
    # SALA: SERVIDOR → CLIENTE
    # ──────────────────────────────────────────────────────────────

    ChatMessage:
      name: chat:message
      title: Mensagem de Chat da Sala (ADR-010)
      summary: Mensagem de texto enviada por um jogador na sala.
      payload:
        type: object
        required: [event, room_id, payload]
        properties:
          event:
            type: string
            const: 'chat:message'
          room_id:
            type: string
          payload:
            type: object
            required: [wallet, message, timestamp]
            properties:
              wallet:
                type: string
                description: Endereço WAX do remetente.
              message:
                type: string
                maxLength: 500
              timestamp:
                type: string
                format: date-time

    SponsorDrop:
      name: chat:sponsor_drop
      title: Notificação de Drop do Sponsor (ADR-011)
      summary: |
        Emitido pelo dropWorker após executar um drop ao final de uma partida.
        Exibido no chat da sala como anúncio especial.
      payload:
        type: object
        required: [event, room_id, payload]
        properties:
          event:
            type: string
            const: 'chat:sponsor_drop'
          room_id:
            type: string
          payload:
            type: object
            required: [winner, asset_type]
            properties:
              winner:
                type: string
                description: Endereço WAX do vencedor do drop.
              asset_type:
                type: string
                enum: [token, nft]
              amount:
                type: string
                description: Quantidade entregue — "X.XXXX SYMBOL" (apenas tokens).
                nullable: true
              nft_asset_id:
                type: string
                description: ID do NFT entregue (apenas NFTs).
                nullable: true
              collection:
                type: string
                nullable: true

    # ──────────────────────────────────────────────────────────────
    # CLIENTE → SERVIDOR
    # ──────────────────────────────────────────────────────────────

    SubscribeGame:
      name: subscribe_game
      title: Entrar no Canal da Partida
      summary: O cliente solicita entrada no canal de um game_id específico.
      payload:
        type: object
        required: [action, game_id]
        properties:
          action:
            type: string
            const: subscribe
          game_id:
            type: string

    SyncRequest:
      name: sync_request
      title: Solicitação de Reconciliação
      summary: |
        Enviado quando o cliente detecta lacuna no campo `order` (pacote perdido).
        O servidor responde com SyncResponse contendo o histórico completo.
      payload:
        type: object
        required: [action, game_id, last_order]
        properties:
          action:
            type: string
            const: sync
          game_id:
            type: string
          last_order:
            type: integer
            description: Último order recebido com sucesso pelo cliente.

    SendChatMessage:
      name: send_chat_message
      title: Enviar Mensagem de Chat
      summary: O cliente envia uma mensagem de texto para a sala.
      payload:
        type: object
        required: [action, room_id, message]
        properties:
          action:
            type: string
            const: chat
          room_id:
            type: string
          message:
            type: string
            maxLength: 500

  schemas:
    WinnerObject:
      type: object
      required: [account, ticket_id, win_pattern, payouts]
      properties:
        account:
          type: string
          description: Conta WAX do vencedor (ex. iuri.wax).
        ticket_id:
          type: string
        win_pattern:
          type: string
          description: Nome do padrão vencido (ex. "ROW_1", "FULL_HOUSE", etc.).
        payouts:
          type: array
          description: Prêmios creditados na wallet interna do jogador.
          items:
            type: string
            pattern: '^[0-9]+\.[0-9]+ [A-Z]+$'
