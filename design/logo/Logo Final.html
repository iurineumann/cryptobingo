<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CryptoBingo — Identidade da marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="logo.css" />
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="22" fill="#6d28d9"/>
    <polygon points="50,24 70,35.5 70,58.5 50,70 30,58.5 30,35.5" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="50" y="88" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">CB</text>
  </svg>
</template>
<style>
  html, body { margin: 0; background: #ece8e2; }
  * { box-sizing: border-box; }
  .sheet {
    width: 1480px; max-width: 100%; margin: 0 auto; padding: 56px 40px 80px;
    font-family: 'Inter', sans-serif; color: #15152a;
  }
  .fs-top { display:flex; align-items:center; justify-content:space-between; margin-bottom: 30px; }
  .fs-brand { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; letter-spacing:-.02em; }
  .fs-brand span { color:#7c3aed; }
  .fs-doc { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#8b86a0; }
  .panel { border-radius: 22px; overflow:hidden; position:relative; }
  .panel.dark  { background: radial-gradient(120% 120% at 26% 16%, #221a40 0%, #14132a 48%, #0c0b18 100%); color:#f1f5f9; }
  .panel.light { background:#ffffff; box-shadow: inset 0 0 0 1px #e7e2f2; color:#15152a; }
  .grid { display:grid; gap:20px; margin-bottom:20px; }
  .g2 { grid-template-columns: 1.45fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .grid-faint::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 74%);
            mask-image:radial-gradient(ellipse at center,#000 25%,transparent 74%);
  }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px;
             letter-spacing:.2em; text-transform:uppercase; color:#a78bfa; }
  .light .eyebrow { color:#7c3aed; }
  .p-pad { padding: 34px 38px; }
  .p-center { display:flex; align-items:center; justify-content:center; }
  .ptitle { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; margin:9px 0 0; letter-spacing:-.01em; }
  .pnote { font-size:12.5px; opacity:.6; margin-top:6px; max-width:42ch; line-height:1.5; }
  .cap { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.07em;
         text-transform:uppercase; opacity:.5; margin-top:10px; text-align:center; }
  .fav { display:flex; flex-direction:column; align-items:center; }
  .swatch { height:80px; border-radius:12px; display:flex; align-items:flex-end; padding:9px 11px;
            font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:#fff; }
  .swatch.dark-txt { color:#15152a; }
  .swatchrow { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .typecard { display:flex; flex-direction:column; gap:4px; }
  .type-lab { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.12em;
              text-transform:uppercase; color:#a78bfa; }
  .divider { height:1px; background:rgba(255,255,255,.08); margin:0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="logos.jsx"></script>

<script type="text/babel">
const { FoxHex, FoxTile, HexMark, Silhouette, Wordmark, LockupH, LockupV } = window;

function App() {
  return (
    <div className="sheet">
      <div className="fs-top">
        <div className="fs-brand">Crypto<span>Bingo</span></div>
        <div className="fs-doc">Identidade da marca · v1</div>
      </div>

      {/* HERO — lockup principal */}
      <div className="panel dark grid-faint p-pad" style={{ marginBottom: 20 }}>
        <div className="eyebrow">Marca principal · Hexágono Token</div>
        <div className="p-center" style={{ padding: '54px 0 46px' }}>
          <LockupH Symbol={FoxHex} sym={132} wm={76} theme="dark" gap={34} />
        </div>
        <div className="p-center"><span className="cap">Lockup horizontal · uso primário</span></div>
      </div>

      {/* lockup claro + empilhado */}
      <div className="grid g2">
        <div className="panel light p-pad p-center" style={{ minHeight: 260, flexDirection:'column' }}>
          <LockupH Symbol={FoxHex} sym={104} wm={58} theme="light" gap={28} />
          <span className="cap" style={{ color:'#8b86a0' }}>Horizontal · fundo claro</span>
        </div>
        <div className="panel dark grid-faint p-pad p-center" style={{ minHeight: 260, flexDirection:'column' }}>
          <LockupV Symbol={FoxHex} sym={120} wm={34} theme="dark" gap={20} />
          <span className="cap">Empilhado</span>
        </div>
      </div>

      {/* símbolo + ícone de app */}
      <div className="grid g2">
        <div className="panel dark grid-faint p-pad">
          <div className="eyebrow">O símbolo</div>
          <div className="ptitle" style={{ color:'#fff' }}>Hexágono · raposa facetada</div>
          <div className="pnote" style={{ color:'#cbd5e1' }}>A faceta de cristal em hexágono comunica token / web3. A raposa é o ativo central da marca.</div>
          <div className="p-center" style={{ gap: 40, marginTop: 26 }}>
            <FoxHex size={150} />
          </div>
        </div>
        <div className="panel dark grid-faint p-pad">
          <div className="eyebrow">Ícone de app · CB</div>
          <div className="ptitle" style={{ color:'#fff' }}>Favicon, avatar e ícone</div>
          <div className="p-center" style={{ marginTop: 18 }}><FoxTile size={130} /></div>
          <div className="p-center" style={{ gap: 26, alignItems:'flex-end', marginTop: 22 }}>
            {[64,40,24,16].map(s => (
              <div className="fav" key={s}>
                <FoxTile size={s} cb={s>=40} />
                <span className="cap">{s}px</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* monocromático */}
      <div className="panel light p-pad" style={{ marginBottom: 20 }}>
        <div className="eyebrow">Versão monocromática · 1 cor</div>
        <div className="grid g3" style={{ marginTop: 22 }}>
          <div className="fav"><HexMark size={120} color="#7c3aed" /><span className="cap" style={{ color:'#8b86a0' }}>Violeta / branco</span></div>
          <div className="fav" style={{ background:'#6d28d9', borderRadius:16, padding:'24px 0' }}>
            <HexMark size={120} color="#ffffff" /><span className="cap" style={{ color:'#fff', opacity:.85 }}>Branco / violeta</span>
          </div>
          <div className="fav"><HexMark size={120} color="#15152a" /><span className="cap" style={{ color:'#8b86a0' }}>Tinta / branco</span></div>
        </div>
      </div>

      {/* paleta */}
      <div className="panel light p-pad" style={{ marginBottom: 20 }}>
        <div className="eyebrow">Paleta</div>
        <div className="ptitle">Violeta + âmbar sobre superfícies escuras</div>
        <div className="swatchrow" style={{ marginTop: 20 }}>
          <div className="swatch" style={{ background:'#a78bfa' }}>#A78BFA</div>
          <div className="swatch" style={{ background:'#8b5cf6' }}>#8B5CF6</div>
          <div className="swatch" style={{ background:'#7c3aed' }}>#7C3AED</div>
          <div className="swatch" style={{ background:'#4c1d95' }}>#4C1D95</div>
          <div className="swatch dark-txt" style={{ background:'#fcd34d' }}>#FCD34D</div>
          <div className="swatch dark-txt" style={{ background:'#f59e0b' }}>#F59E0B</div>
          <div className="swatch" style={{ background:'#1a1a2e' }}>#1A1A2E</div>
          <div className="swatch" style={{ background:'#0f0f1a' }}>#0F0F1A</div>
        </div>
      </div>

      {/* tipografia */}
      <div className="panel dark grid-faint p-pad" style={{ marginBottom: 20 }}>
        <div className="eyebrow">Tipografia</div>
        <div className="grid g3" style={{ marginTop: 20 }}>
          <div className="typecard">
            <span className="type-lab">Display · Space Grotesk</span>
            <span style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:40, letterSpacing:'-.03em', color:'#fff' }}>CryptoBingo</span>
            <span style={{ fontFamily:'Space Grotesk', fontWeight:500, fontSize:15, color:'#94a3b8' }}>Aa Bb Cc · 0123456789</span>
          </div>
          <div className="typecard">
            <span className="type-lab">Texto · Inter</span>
            <span style={{ fontFamily:'Inter', fontWeight:600, fontSize:24, color:'#fff' }}>Provably fair, instantâneo</span>
            <span style={{ fontFamily:'Inter', fontWeight:400, fontSize:14, color:'#94a3b8' }}>Aa Bb Cc · interface e conteúdo</span>
          </div>
          <div className="typecard">
            <span className="type-lab">Mono · JetBrains Mono</span>
            <span style={{ fontFamily:'JetBrains Mono', fontWeight:600, fontSize:24, color:'#fcd34d' }}>1,240 WAX</span>
            <span style={{ fontFamily:'JetBrains Mono', fontWeight:500, fontSize:13, color:'#94a3b8' }}>hash · wallet · valores</span>
          </div>
        </div>
      </div>

      {/* aplicação — navbar */}
      <div className="panel dark" style={{ overflow:'hidden' }}>
        <div className="p-pad" style={{ paddingBottom: 0 }}>
          <div className="eyebrow">Aplicação</div>
        </div>
        <div style={{ height:68, marginTop:18, borderTop:'1px solid rgba(255,255,255,.08)',
          display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 26px',
          background:'rgba(15,15,26,.92)' }}>
          <LockupH Symbol={FoxHex} sym={34} wm={22} theme="dark" gap={12} />
          <div style={{ display:'flex', gap:4, padding:4, background:'rgba(255,255,255,.05)',
            border:'1px solid rgba(255,255,255,.06)', borderRadius:10 }}>
            {['Jogar','Salas','Histórico'].map((t,i)=>(
              <span key={t} style={{ padding:'7px 16px', fontSize:13.5, fontWeight:600, borderRadius:7,
                color: i===0 ? '#f1f5f9' : '#94a3b8',
                background: i===0 ? '#0f0f1a' : 'transparent',
                boxShadow: i===0 ? '0 0 0 1px rgba(255,255,255,.1)' : 'none' }}>{t}</span>
            ))}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ display:'inline-flex', gap:6, alignItems:'baseline', padding:'8px 13px',
              borderRadius:999, background:'linear-gradient(135deg,rgba(245,158,11,.18),rgba(30,30,53,.8))',
              border:'1px solid rgba(245,158,11,.3)', fontFamily:'JetBrains Mono', fontSize:12.5,
              color:'#fcd34d', fontWeight:700 }}>1,240 <span style={{ fontSize:10, opacity:.8 }}>WAX</span></span>
            <span style={{ display:'inline-flex', gap:7, alignItems:'center', padding:'8px 13px',
              borderRadius:999, background:'#1e1e35', border:'1px solid rgba(255,255,255,.1)',
              fontFamily:'JetBrains Mono', fontSize:12.5, color:'#94a3b8' }}>
              <span style={{ width:7, height:7, borderRadius:99, background:'#34d399', boxShadow:'0 0 8px #34d399' }}></span>
              wax··7f3a</span>
          </div>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
