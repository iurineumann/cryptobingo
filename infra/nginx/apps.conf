    ssl_certificate_key /etc/letsencrypt/live/cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/static/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback + WebSocket upgrade (lobby ao vivo)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://tagmanager.google.com https://*.clarity.ms https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://tagmanager.google.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.googletagmanager.com https://ssl.gstatic.com https://*.clarity.ms; connect-src 'self' https://*.cryptobingo.bet wss://*.cryptobingo.bet https://fonts.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://*.clarity.ms https://waxtestnet.greymass.com https://wax-testnet.eosphere.io https://testnet.waxsweden.org https://testnet.wax.eosusa.io https://cb.anchor.link wss://cb.anchor.link https://wax-testnet.api.atomicassets.io; frame-src 'self' https://www.googletagmanager.com; worker-src 'self' blob:" always;
        try_files $uri $uri/ /index.html;
    }
}

