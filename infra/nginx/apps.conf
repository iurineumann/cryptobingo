map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name landing-api.cryptobingo.bet test-api.cryptobingo.bet;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name landing-api.cryptobingo.bet;
    ssl_certificate /etc/letsencrypt/live/cryptobingo.bet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $la_upstream http://landing-api:8080;
        proxy_pass $la_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name test-api.cryptobingo.bet;
    ssl_certificate /etc/letsencrypt/live/cryptobingo.bet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $api_upstream http://api-gateway:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
    }
}
