map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name landing-api.cryptobingo.bet test-api.cryptobingo.bet;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name landing-api.cryptobingo.bet;
    ssl_certificate /etc/letsencrypt/live/cryptobingo.bet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $la_upstream http://landing-api:8080;
        proxy_pass $la_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name test-api.cryptobingo.bet;
    ssl_certificate /etc/letsencrypt/live/cryptobingo.bet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $api_upstream http://api-gateway:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
    }
}

# ── Metrics (Grafana) ───────────────────────────────────────────────
server {
    listen 80;
    server_name metrics.cryptobingo.bet;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name metrics.cryptobingo.bet;

    ssl_certificate     /etc/letsencrypt/live/metrics.cryptobingo.bet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ════════════════════════════════════════════════════════════════════
# STATIC FRONTENDS (migrados de Azure SWA → VPS, ADR-060)
# Volume: /opt/cryptobingo/static:/usr/share/nginx/static:ro
# Deploy: scripts/deploy-static-vps.sh <app>
# ════════════════════════════════════════════════════════════════════

# ── landing-page (SSG, Astro) ──────────────────────────────────────
server {
    listen 80;
    server_name cryptobingo.bet www.cryptobingo.bet;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cryptobingo.bet www.cryptobingo.bet;
    ssl_certificate /etc/letsencrypt/live/cryptobingo.bet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/static/landing;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 301 / → /en/ (SSG i18n)
    location = / {
        return 301 /en/;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SSG fallback → /en/index.html (navigationFallback do SWA)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://tagmanager.google.com https://*.clarity.ms https://cdn.jsdelivr.net https://static.cloudflareinsights.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://tagmanager.google.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com data:; img-src 'self' data: https://www.googletagmanager.com https://ssl.gstatic.com https://*.clarity.ms https://static.cloudflareinsights.com; connect-src 'self' https://*.cryptobingo.bet https://www.google-analytics.com https://analytics.google.com https://*.clarity.ms https://identity.tinajs.io https://identity-v2.tinajs.io https://content.tinajs.io https://assets.tinajs.io https://static.cloudflareinsights.com https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src 'self' https://www.googletagmanager.com" always;
        try_files $uri $uri/ /en/index.html;
    }
}

# ── frontend (SPA, Vite) ────────────────────────────────────────────
server {
    listen 80;
    server_name test.cryptobingo.bet;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.cryptobingo.bet;
