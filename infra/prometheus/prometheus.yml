global:
  scrape_interval:     10s
  evaluation_interval: 10s

scrape_configs:
  # ── Prometheus (self-monitoring) ─────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── cAdvisor (métricas de containers Docker) ─────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── RabbitMQ (plugin Prometheus — expõe /metrics na porta 15692) ─────────────
  # Requer: rabbitmq-plugins enable rabbitmq_prometheus
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # ── Game Loop Worker (porta 9091 — exposta pelo metrics.ts) ──────────────────
  # Em dev+compose: o worker roda dentro do Docker → service name
  - job_name: 'worker_game_loop'
    static_configs:
      - targets: ['worker-game-loop:9091']
    scrape_interval: 5s   # Mais frequente: eventos de jogo são críticos
    metrics_path: '/metrics'

  # ── API Gateway (porta 9092 — servidor HTTP isolado, sem auth/CORS) ───────────
  - job_name: 'api_gateway'
    static_configs:
      - targets: ['api-gateway:9092']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # ── PostgreSQL (postgres_exporter — porta 9187) ───────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # ── Redis (redis_exporter — porta 9121) ──────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s

  # ── MongoDB (mongodb_exporter — porta 9216) ───────────────────────────────────
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    scrape_interval: 15s

  # ── PostgreSQL Cryptobingo (postgres-exporter-cryptobingo — porta 9188) ────────
  # Expõe métricas custom do email_log (queries.yml)
  - job_name: 'postgres_cryptobingo_email'
    static_configs:
      - targets: ['postgres-exporter-cryptobingo:9188']
    scrape_interval: 15s

  # ── Postfix (postfix-exporter — porta 9559) ────────────────────────────────────
  - job_name: 'postfix'
    static_configs:
      - targets: ['postfix-exporter:9559']
    scrape_interval: 15s
