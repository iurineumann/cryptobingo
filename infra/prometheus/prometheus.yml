global:
  scrape_interval: 10s # De 10 em 10 segundos, coleta os dados
  evaluation_interval: 10s

scrape_configs:
  # O próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # O vigia de consumo de CPU/Memória dos containers
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Monitoramento da Fila do RabbitMQ (Requer plugin prometheus ativado no Rabbit)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']