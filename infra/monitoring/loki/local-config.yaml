# Loki — config explícito (monolith, filesystem).
# Corrige o bug de "entry too far behind" (PR #328 / issue #325):
# o local-config DEFAULT do image 2.9.8 NÃO define limits_config, logo vale o
# out-of-order window = max_chunk_age/2 = 1h. Logs com timestamp >1h no passado
# (ex: backfill de logs antigos do promtail) travam o watermark e TUDO é rejeitado
# com 400. `reject_old_samples: false` desliga essa proteção (aceita backfill).
# Doc: https://grafana.com/docs/loki/latest/operations/troubleshooting/troubleshoot-ingest/
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_proto: http
    instance_port: 9095
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false        # aceita logs antigos (backfill) — fix do 400
  reject_old_samples_max_age: 0     # 0 = sem limite de idade
  max_chunk_age: 2h                   # janela OOO = 1h (default); mantemos explícito
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6
  max_label_name_length: 1024
  max_label_value_length: 4096
  allow_structured_metadata: false

ruler:
  alertmanager_url: http://localhost:9093

table_manager:
  retention_deletes_enabled: true
  retention_period: 7d

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_period: 7d
