# Promtail — coleta logs dos containers Docker e envia ao Loki.
# Service discovery via docker.sock extrai o label `container_name` (e `container_id`).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Mantém apenas o nome do container como label `container`
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Tags de compose (service) se houver
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # Logs de stack do sistema (monitoring) não são necessários; mantemos todos os containers
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
