# Stack de observabilidade — usa os arquivos do repo (infra/prometheus, infra/grafana).
# Prometheus + Grafana + exporters nas redes cb-back (alcanca DBs/apps) e cb-front (nginx proxya Grafana).
# Loki + Promtail adicionados em 2026-07-15 (#325) para centralizar logs dos containers.
name: cryptobingo-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra-monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks: [cb-back, cb-front]

  grafana:
    image: grafana/grafana:11.1.7
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: zNlGJM3jmx4fskMJE6XGXCMs
      GF_SERVER_ROOT_URL: http://metrics.cryptobingo.bet
    volumes:
      - graf_data:/var/lib/grafana
      - ./infra-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra-monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    networks: [cb-back, cb-front]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command: ['--path.procfs=/host/proc','--path.sysfs=/host/sys','--path.rootfs=/rootfs']
    networks: [cb-back]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [cb-back]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://cryptobingo:***@postgres:5432/postgres?sslmode=disable'
    networks: [cb-back]

  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: 'redis://appuser:***@redis:6379'
    networks: [cb-back]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: unless-stopped
    command: ['--mongodb.uri=mongodb://admin:***@mongo:27017/?authSource=admin','--web.listen-address=:9216','--collect-all']
    networks: [cb-back]

  # ─── Loki: agregador de logs (monolith, filesystem) ───
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./infra-monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [cb-back]

  # ─── 2º Postgres Exporter (porta 9188) — db cryptobingo, métricas de email_log ───
  postgres-exporter-cryptobingo:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-cryptobingo
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://cryptobingo:${PG_APP_PW}@postgres:5432/cryptobingo?sslmode=disable'
    command:
      - '--extend.query-path=/etc/postgres-exporter/queries.yml'
    volumes:
      - ./infra-monitoring/postgres-cryptobingo/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks: [cb-back]

  # ─── Promtail: coleta logs dos containers Docker e envia ao Loki ───
  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    command:
      - '-config.file=/etc/promtail/config.yml'
    volumes:
      - ./infra-monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [cb-back]

  # ─── Promtail mail.log: coleta logs do Postfix (host) e envia ao Loki ───
  promtail-mail:
    image: grafana/promtail:2.9.8
    container_name: promtail-mail
    restart: unless-stopped
    command:
      - '-config.file=/etc/promtail/maillog-config.yml'
    volumes:
      - ./infra-monitoring/promtail/maillog-config.yml:/etc/promtail/maillog-config.yml:ro
      - /var/log/mail.log:/var/log/mail.log:ro
    depends_on: [loki]
    networks: [cb-back]

networks:
  cb-back: {external: true}
  cb-front:
    external: true
    name: cryptobingo_cb-front

volumes:
  prom_data:
    external: true
    name: cryptobingo_prom_data
  graf_data:
    external: true
    name: cryptobingo_graf_data
  loki_data:
    external: true
    name: cryptobingo_loki_data
