apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/secrets

patches:
  # Prod: réplicas aumentadas
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api-gateway
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: worker-game-loop
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: frontend
  # Prod: resources mais generosos
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
    target:
      kind: Deployment
      name: api-gateway
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
    target:
      kind: Deployment
      name: worker-game-loop

images:
  - name: cryptobingo/api-gateway
    newName: ghcr.io/iurineumann/cryptobingo-api-gateway
    newTag: stable
  - name: cryptobingo/worker-game-loop
    newName: ghcr.io/iurineumann/cryptobingo-worker-game-loop
    newTag: stable
  - name: cryptobingo/frontend
    newName: ghcr.io/iurineumann/cryptobingo-frontend
    newTag: stable
  - name: cryptobingo/swap-ui
    newName: ghcr.io/iurineumann/cryptobingo-swap-ui
    newTag: stable
