apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Dev: 1 réplica para economizar recursos
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: api-gateway
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: worker-game-loop
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  # Dev: RPC local
  - patch: |-
      - op: replace
        path: /data/RPC_URL
        value: "http://bingo_waxdev:8888"
      - op: replace
        path: /data/NODE_ENV
        value: "development"
      - op: replace
        path: /data/VERIFY_KEY_ONCHAIN
        value: "false"
      - op: replace
        path: /data/ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
    target:
      kind: ConfigMap
      name: cryptobingo-config

images:
  - name: cryptobingo/api-gateway
    newTag: dev
  - name: cryptobingo/worker-game-loop
    newTag: dev
  - name: cryptobingo/frontend
    newTag: dev
