apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyID:
            name: aws-eso-creds
            key: access-key
          secretAccessKey:
            name: aws-eso-creds
            key: secret-access-key
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-eso-creds
  namespace: cryptobingo
type: Opaque
stringData:
  access-key: "SUBSTITUIR"
  secret-access-key: "SUBSTITUIR"
