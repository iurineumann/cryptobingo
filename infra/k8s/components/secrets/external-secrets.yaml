# ExternalSecret: substitui os Secrets estáticos do base/secrets.yaml.
# Requer:
#   1. External Secrets Operator instalado no cluster
#   2. ClusterSecretStore "cryptobingo-secrets-store" configurado
#
# Para criar o store:
#   Infra gerenciada → AWS Secrets Manager / GCP Secret Manager / Azure Key Vault
#   Dev/testnet → kubectl create secret generic cryptobingo-secrets-store-creds ...
#
# Exemplo AWS Secrets Manager:
#   kubectl apply -f - <<EOF
#   apiVersion: external-secrets.io/v1beta1
#   kind: ClusterSecretStore
#   metadata:
#     name: cryptobingo-secrets-store
#   spec:
#     provider:
#       aws:
#         service: SecretsManager
#         region: us-east-1
#         auth:
#           secretRef:
#             accessKeyID: { name: aws-eso-creds, key: access-key }
#             secretAccessKey: { name: aws-eso-creds, key: secret-access-key }
#   EOF
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cryptobingo-secrets
  namespace: cryptobingo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryptobingo-secrets-store
    kind: ClusterSecretStore
  target:
    name: cryptobingo-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: JWT_SECRET
    - secretKey: CONTRACT_PRIVATE_KEY
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: CONTRACT_PRIVATE_KEY
    - secretKey: MICROSERVICE_PRIVATE_KEY
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: MICROSERVICE_PRIVATE_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: POSTGRES_PASSWORD
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: MONGO_PASSWORD
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: RABBITMQ_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cryptobingo-db-urls
  namespace: cryptobingo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryptobingo-secrets-store
    kind: ClusterSecretStore
  target:
    name: cryptobingo-db-urls
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URL
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: MONGO_URL
    - secretKey: POSTGRES_URL
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: POSTGRES_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: REDIS_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: /cryptobingo/prod/secrets
        property: RABBITMQ_URL
