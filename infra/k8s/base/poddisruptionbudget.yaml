# PodDisruptionBudgets garantem disponibilidade durante node drain / rolling updates.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: cryptobingo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: cryptobingo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker-game-loop
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: cryptobingo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
