apiVersion: v1
kind: Secret
metadata:
  name: cryptobingo-secrets
  namespace: cryptobingo
type: Opaque
stringData:
  JWT_SECRET: "SUBSTITUIR_EM_PRODUCAO"
  CONTRACT_PRIVATE_KEY: "SUBSTITUIR_EM_PRODUCAO"
  MICROSERVICE_PRIVATE_KEY: "SUBSTITUIR_EM_PRODUCAO"
  POSTGRES_PASSWORD: "SUBSTITUIR_EM_PRODUCAO"
  MONGO_PASSWORD: "SUBSTITUIR_EM_PRODUCAO"
  RABBITMQ_PASSWORD: "SUBSTITUIR_EM_PRODUCAO"
---
apiVersion: v1
kind: Secret
metadata:
  name: cryptobingo-db-urls
  namespace: cryptobingo
type: Opaque
stringData:
  MONGO_URL: "mongodb://cryptobingo:SUBSTITUIR@mongodb-svc:27017/cryptobingo_edge?authSource=admin"
  POSTGRES_URL: "postgresql://cryptobingo:SUBSTITUIR@postgres-svc:5432/cryptobingo"
  REDIS_URL: "redis://redis-svc:6379"
  RABBITMQ_URL: "amqp://cryptobingo:SUBSTITUIR@rabbitmq-svc:5672"
