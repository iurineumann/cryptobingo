apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cryptobingo-ingress
  namespace: cryptobingo
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Headers de segurança
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TLS: cert-manager gerencia renovação automática
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting no ingress (camada adicional ao rate limit da aplicação)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # WebSocket (worker broadcaster + api-gateway socket.io /chat)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "worker-svc,api-gateway-svc"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cryptobingo.io
        - www.cryptobingo.io
        - api.cryptobingo.io
      secretName: cryptobingo-tls
  rules:
    - host: api.cryptobingo.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  name: http
    - host: cryptobingo.io
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: worker-svc
                port:
                  name: ws
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  name: http
    - host: www.cryptobingo.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  name: http
