kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cryptobingo-dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8090
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
networking:
  # Permite que pods acessem o host via host.docker.internal (nodeos WAX local)
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
