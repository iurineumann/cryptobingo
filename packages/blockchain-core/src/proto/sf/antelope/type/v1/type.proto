syntax = "proto3";

package sf.antelope.type.v1;

// Subconjunto do sf.antelope.type.v1 necessário para extrair action_traces de
// um bloco Firehose Pinax WAX testnet.
//
// NÚMEROS DE CAMPO validados contra:
//  - streamingfast/firehose-antelope @ buf.build (fonte original firehose.proto)
//  - grpcurl reflection no waxtest.firehose.pinax.network:443 (2026-07-18)
// O servidor empacota o Block em google.protobuf.Any (ver firehose_v2.proto);
// aqui definimos APENAS os campos que o client navega (e os pais imediatos).
// Campos não listados são ignorados no decode (proto3 tolera campos ausentes).

message Block {
  string id = 1;
  uint64 number = 2;
  // Preenchido pelo transform de filtro do Pinax (filtered_transaction_traces).
  repeated TransactionTrace filtered_transaction_traces = 20;
}

message TransactionTrace {
  string id = 1;
  uint64 block_num = 2;
  repeated ActionTrace action_traces = 9;
}

message ActionTrace {
  ActionReceipt receipt = 1;
  Action action = 2;
  bool context_free = 3;
  int64 elapsed = 4;
  string console = 5;
  string transaction_id = 6;
  uint64 block_num = 7;
  string producer_block_id = 8;
  string receiver = 11;
  uint32 action_ordinal = 16;
  uint32 creator_action_ordinal = 17;
}

message Action {
  string account = 1;
  string name = 2;
  repeated PermissionLevel authorization = 3;
  string json_data = 4;
  bytes raw_data = 5;
}

message ActionReceipt {
  string receiver = 1;
  string digest = 2;
  uint64 global_sequence = 3;
  uint64 recv_sequence = 5;
  uint64 code_sequence = 6;
  uint64 abi_sequence = 7;
}

message PermissionLevel {
  string actor = 1;
  string permission = 2;
}
