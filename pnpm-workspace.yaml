packages:
  # Pasta para os microsserviços e frontend
  - 'apps/*'
  # Excluir escrow-service (serviço off-chain separado, roda independente na VPS)
  - '!apps/escrow-service'
  # Pasta para os pacotes compartilhados (ex: tipos do C++ exportados para TypeScript)
  - 'packages/*'
  # Opcional: ignorar a pasta de contratos se o pnpm tentar ler algo lá
  - '!contracts/**'

# Overrides de segurança (pnpm v9+ lê daqui; v8 lê de package.json)
overrides:
  dotenv: 16.4.5
