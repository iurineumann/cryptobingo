version: '3.8'

services:
  # --------------------------------------------------------
  # 1. ANTELOPE BLOCKCHAIN NODE (NODEOS)
  # --------------------------------------------------------
  nodeos:
    image: antelopetestnet/leap:4.0.0
    container_name: bingo_nodeos
    ports:
      - "8888:8888" # RPC API (Usado pelo WharfKit no celular/backend)
      - "8080:8080" # State History Plugin (SHIP)
    environment:
      - EOSIO_ROOT_KEY=5KQwrPbwdL6PhXujxW278EGzaVqexa18rcMvUKdpjzJVjc4jgw
    command: >
      nodeos -e -p eosio
      --plugin eosio::producer_plugin
      --plugin eosio::chain_api_plugin
      --plugin eosio::http_plugin
      --plugin eosio::state_history_plugin
      --access-control-allow-origin='*'
      --contracts-console
      --http-validate-host=false
      --verbose-http-errors
      --state-history-endpoint 0.0.0.0:8080
      --trace-history
      --chain-state-history
    volumes:
      - ./nodeos_data:/root/.local/share/eosio/nodeos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/v1/chain/get_info"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------
  # 2. KEY MANAGER (KEOSD)
  # --------------------------------------------------------
  keosd:
    image: antelopetestnet/leap:4.0.0
    container_name: bingo_keosd
    ports:
      - "8900:8900"
    command: keosd --http-server-address=0.0.0.0:8900 --unlock-timeout=9000000
    volumes:
      - ./keosd_data:/root/eosio-wallet

  # --------------------------------------------------------
  # 3. BARRAMENTO DE EVENTOS E ÍNDICE INVERTIDO (REDIS)
  # --------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: bingo_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis_data:/data

  # --------------------------------------------------------
  # 4. FERRAMENTA DE AUDITORIA VISUAL (REDIS COMMANDER)
  # --------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bingo_redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis