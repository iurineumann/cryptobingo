server {
    listen 80;
    server_name landing-api.cryptobingo.bet;
    # redireciona HTTP->HTTPS (certbot/LetsEncrypt já emitiu cryptobingo.bet)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name landing-api.cryptobingo.bet;
    ssl_certificate /etc/letsencrypt/live/cryptobingo.bet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptobingo.bet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://landing-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}
