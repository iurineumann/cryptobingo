# landing-api (VPS Docker)
# Exposto via cryptobingo-nginx (rede cryptobingo_cb-front) que já tem server_block
# proxy_pass http://landing-api:8080. Por isso o landing-api DEVE estar na rede
# cryptobingo_cb-front (mesma do nginx) para o DNS Docker resolver o nome.
# Mas o landing-api TAMBEM precisa da rede cryptobingo (onde está o container
# postgres) para conectar ao banco. Logo: AMBAS as redes.
# O nginx interno deste compose foi REMOVIDO (conflitava de porta 80/443 com o
# cryptobingo-nginx e era redundante).

services:
  landing-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cryptobingo-landing-api:latest
    container_name: landing-api
    restart: unless-stopped
    networks:
      - cb-back
      - cryptobingo_cb-front
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      SMTP_HOST: "mail.cryptobingo.bet"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "cryptobingo"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_SENDER: "contact@cryptobingo.bet"
      ADMIN_EMAIL: "admin@cryptobingo.bet"
      GATEWAY_URL: "https://test-api.cryptobingo.bet"

networks:
  cb-back:
    external: true
  cryptobingo_cb-front:
    external: true
