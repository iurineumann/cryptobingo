      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="48%"  stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3f1d8a"/>
    </radialGradient>
    <linearGradient id="tile-shine" x1="0.06" y1="0.97" x2="0.94" y2="0.03">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="38%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
