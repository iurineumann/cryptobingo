<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CryptoBingo">
  <defs>
    <radialGradient id="og-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="og-glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hex-og" cx="36%" cy="28%" r="72%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="45%"  stop-color="#7c3aed"/>
      <stop offset="78%"  stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#3a1a72"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="350" cy="315" r="500" fill="url(#og-glow)"/>
  <g transform="translate(60,85) scale(1.8)">
    <polygon points="112,2 218,62 218,182 112,242 6,182 6,62" fill="url(#hex-og)"/>
    <image href="fox_10.png" x="42" y="42" width="140" height="140"/>
  </g>
  <text x="430" y="330" font-family="'Space Grotesk','Inter',sans-serif" font-weight="700" font-size="72" letter-spacing="-2.9">
    <tspan fill="#f1f5f9">Crypto</tspan><tspan fill="#a78bfa">Bingo</tspan>
  </text>
  <text x="430" y="490" font-family="'Inter',sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="-0.5">Bingo on-chain &bull; Provably fair na WAX</text>
</svg>
