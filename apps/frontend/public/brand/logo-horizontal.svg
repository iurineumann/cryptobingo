<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 920 240" width="920" height="240"
     role="img" aria-label="CryptoBingo">
  <title>CryptoBingo</title>

  <!-- Símbolo: composed_logo.webp (hexágono + raposa já compostos) -->
  <image href="/brand/icon.webp"
         x="0" y="0" width="240" height="240"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark: CryptoBingo em Space Grotesk -->
  <text
    x="256" y="158"
    font-family="'Space Grotesk','Inter',sans-serif"
    font-weight="700"
    font-size="110"
    letter-spacing="-3"
  >
    <tspan fill="#15152a">Crypto</tspan><tspan fill="#7c3aed">Bingo</tspan>
  </text>
</svg>
