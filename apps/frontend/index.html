    <!-- Evita flash de tema incorreto (inline, síncrono) -->

      (function() {
        try {
          var saved = localStorage.getItem('cb_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>

        'ad_personalization':'denied',
        'functionality_storage':'granted',
        'personalization_storage':'denied',
        'security_storage':'granted',
        'wait_for_update':500

      gtag('set','ads_data_redaction',true);
      gtag('set','url_passthrough',true);
    </script>

    <!-- CookieConsent JS + init LGPD-compliant -->
    <script defer src="https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3/dist/cookieconsent.umd.js" crossorigin="anonymous"></script>
    <script>
    document.addEventListener('DOMContentLoaded',function(){

      function getCats(cats){
        if(Array.isArray(cats)){
          return {
            analytics: cats.indexOf('analytics') !== -1,
            marketing: cats.indexOf('marketing') !== -1,
            ads: cats.indexOf('ads') !== -1
          };
        }
        return cats||{};
      }

      function updateGtag(cookie){
        var cats=getCats(cookie.categories);
        gtag('consent','update',{
          'analytics_storage': cats.analytics?'granted':'denied',
          'ad_storage': cats.ads?'granted':'denied',
          'ad_user_data': cats.ads?'granted':'denied',
          'ad_personalization': cats.ads?'granted':'denied',
          'functionality_storage': 'granted',
          'personalization_storage': cats.marketing?'granted':'denied',
          'security_storage': 'granted'
        });
      }

      function logConsent(cookie){
        try{
          var cats=getCats(cookie.categories);
          localStorage.setItem('cb_consent',JSON.stringify({
            timestamp: new Date().toISOString(),
            categories: Object.keys(cats).filter(function(k){return cats[k];}),
            consentId: (crypto.randomUUID&&crypto.randomUUID())||Date.now().toString(36),
            version: '2026.07'
          }));
        }catch(e){}
      }

      function startClarity(){
        if(window.clarity) return;
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window,document,'clarity','script','xge781i2so');
      }

      function stopClarity(){
        if(typeof clarity!=='undefined') clarity('stop');
      }

      function handleConsent(cookie){
        updateGtag(cookie);
        logConsent(cookie);
        var cats=getCats(cookie.categories);
        window._analyticsConsented = cats.analytics;
        cats.analytics ? startClarity() : stopClarity();
        if(cats.analytics||cats.marketing){
          window.dataLayer.push({
            event: 'page_view',
            page_path: window.location.pathname,
            page_title: document.title
          });
        }
      }

      if(typeof CookieConsent==='undefined') return;

      CookieConsent.run({

        autoclearCookies: true,

        categories: {
          necessary: {
            enabled: true,
            readOnly: true,
            cookies: [
              { name: /^cb_/ },
              { name: /^connect\.sess$/ },
            ]

          analytics: {
            cookies: [
              { name: /^_ga/ },
              { name: /^_gid/ },
              { name: /^_cl_/ },
              { name: /^_clsk/ },
            ]
          },
          marketing: {
            cookies: [
              { name: /^_gcl_/ },
              { name: /^_fbp/ },
            ]
          }
        },

        language: {
          default: 'pt',
          autoDetect: 'browser',
          translations: {
            pt: {
              consentModal: {
                title: '🍪 Usamos cookies',
                description: 'Utilizamos cookies para garantir o funcionamento do site, analisar o tráfego e, com seu consentimento, personalizar sua experiência. Consulte nossa <a href="/privacy" class="cc-link">Política de Privacidade</a>.',
                acceptAllBtn:  'Aceitar todos',
                acceptNecessaryBtn: 'Apenas necessários',
                showPreferencesBtn: 'Personalizar',
                footer: '<a href="/privacy">Política de Privacidade</a> · <a href="/privacy#direitos">Seus direitos LGPD</a> · <a href="mailto:dpo@cryptobingo.bet">DPO</a>'
              },
              preferencesModal: {
                title: 'Central de Preferências de Cookies',
                acceptAllBtn:  'Aceitar todos',
                acceptNecessaryBtn: 'Apenas necessários',
                savePreferencesBtn: 'Salvar preferências',
                closeIconLabel: 'Fechar',
                sections: [
                  { title: 'Uso de Cookies', description: 'Usamos cookies para melhorar sua experiência. Você pode escolher quais categorias deseja permitir. Para mais detalhes, veja nossa <a href="/privacy">Política de Privacidade</a>.' },
                  { title: 'Estritamente Necessários', description: 'Essenciais para o funcionamento básico do site. Não podem ser desativados.', linkedCategory: 'necessary', cookies: [
                    { name: 'cb_theme', description: 'Preferência de tema (claro/escuro)', domain: '.cryptobingo.bet' },

                    { name: '_cl_*', description: 'Sessão do Microsoft Clarity', domain: '.cryptobingo.bet' }
                  ]},
                  { title: 'Marketing', description: 'Permitem rastrear conversões e exibir anúncios relevantes. Utilizados apenas com seu consentimento explícito.', linkedCategory: 'marketing', cookies: [
                    { name: '_gcl_*', description: 'Conversões do Google Ads', domain: '.cryptobingo.bet' }
                  ]},
                  { title: 'Seus direitos (LGPD)', description: 'Você pode revogar ou alterar seu consentimento a qualquer momento nas configurações do navegador ou clicando no link "Alterar preferências" no rodapé do site. Para exercer seus direitos de titular (acesso, correção, exclusão, portabilidade), entre em contato: <a href="mailto:dpo@cryptobingo.bet">dpo@cryptobingo.bet</a>.' }

                acceptAllBtn:  '接受全部',

                footer: '<a href="/privacy">隐私政策</a> · <a href="/privacy#rights">您的权利 (LGPD)</a> · <a href="mailto:dpo@cryptobingo.bet">数据保护官</a>'

                acceptAllBtn:  '接受全部',
                acceptNecessaryBtn: '仅必要',
                savePreferencesBtn: '保存偏好',
                closeIconLabel: '关闭',
                sections: [
                  { title: 'Cookie 使用说明', description: '我们使用 Cookie 来改善您的体验。选择您允许的类别。请参阅我们的<a href="/privacy">隐私政策</a>。' },
                  { title: '绝对必要', description: '网站基本功能所必需。无法禁用。', linkedCategory: 'necessary' },
                  { title: '分析', description: '收集匿名使用数据以改进我们的服务。包括 Google Analytics 和 Microsoft Clarity。数据可能传输至美国（Google、Microsoft）。', linkedCategory: 'analytics' },
                  { title: '营销', description: '跟踪转化并展示相关广告。仅在您明确同意后使用。', linkedCategory: 'marketing' },
                  { title: '您的权利 (LGPD)', description: '您可随时通过浏览器设置或页脚的"更改偏好"链接撤销或更改同意。如需行使数据主体权利（访问、更正、删除、可携带性），请联系：<a href="mailto:dpo@cryptobingo.bet">dpo@cryptobingo.bet</a>。' }
                ]
              }
            }
          }
        },

        guiOptions: {
          consentModal: {
            layout: 'cloud',
            position: 'bottom center',
            equalWeightButtons: true,
            flipButtons: false
          },
          preferencesModal: {
            layout: 'box',
            equalWeightButtons: true,
            flipButtons: false
          }
        },

        onFirstConsent: function({cookie}){ handleConsent(cookie); },
        onConsent: function({cookie}){ handleConsent(cookie); },
        onChange: function({cookie}){ handleConsent(cookie); }

      });
    });
