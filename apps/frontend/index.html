<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CryptoBingo — Bingo on-chain, provably fair. Sorteio verificável via oráculo WAX." />
    <meta name="theme-color" content="#6d28d9" />

    <title>CryptoBingo — Bingo GameFi na WAX</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Brand assets -->
    <link rel="icon" type="image/webp" sizes="any" href="/brand/icon.webp" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand/app-icon-512.png" />
    <meta property="og:image" content="/brand/app-icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:title" content="CryptoBingo — Bingo on-chain, provably fair" />
    <meta property="og:description" content="Sorteios verificáveis na blockchain WAX. Pagamento automático via smart contract." />
    <meta property="og:type" content="website" />

    <!-- Preconnect para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fontes:
        Inter          — corpo do texto (alta legibilidade, otimizado para telas)
        Space Grotesk  — display/headings (look moderno e gaming)
        JetBrains Mono — endereços de carteira e hashes
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Evita flash de tema incorreto (inline, síncrono) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cb_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
