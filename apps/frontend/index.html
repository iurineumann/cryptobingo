<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CryptoBingo — Bingo on-chain, provably fair. Sorteio verificável via oráculo WAX." />
    <meta name="theme-color" content="#0f0f1a" />

    <title>CryptoBingo — Bingo GameFi na WAX</title>

    <!-- Preconnect para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fontes:
        Inter          — corpo do texto (alta legibilidade, otimizado para telas)
        Space Grotesk  — display/headings (look moderno e gaming)
        JetBrains Mono — endereços de carteira e hashes
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Evita flash de tema incorreto (inline, síncrono) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cb_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
