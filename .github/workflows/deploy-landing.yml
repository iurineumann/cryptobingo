name: Deploy Landing Page

on:
  push:
    branches: [develop, master]
    paths:
      - 'apps/landing-page/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  VITE_API_URL: 'https://landing-api.cryptobingo.bet/api'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing-page

    steps:
      # IMPORTANTE: o landing-page depende do submodule content/ (cryptobingo-tina.git,
      # com slugs.json de slugs dinamicos ADR-040). Sem o submodule, o build falha:
      # "Invalid route exports found when prerendering with ssr:false".
      # Preceito: GitHub Actions BLOQUEADAS em free tier -> deploy SEMPRE manual.
      # No deploy manual, rodar ANTES do build: git submodule update --init --recursive
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - run: pnpm --filter @cryptobingo/landing-page build
        working-directory: .

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}
          action: upload
          app_location: apps/landing-page
          output_location: build/client
          skip_app_build: true
