name: Build & Push + Deploy Testnet (Azure)

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/${{ github.repository_owner }}
  AZURE_RG: cryptobingo-testnet

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      rpc_url: ${{ steps.out.outputs.rpc_url }}
      api_url: ${{ steps.out.outputs.api_url }}
      ws_url: ${{ steps.out.outputs.ws_url }}
      chain_id: ${{ steps.out.outputs.chain_id }}
      contract_account: ${{ steps.out.outputs.contract_account }}
      swap_contract: ${{ steps.out.outputs.swap_contract }}
      env_name: ${{ steps.out.outputs.env_name }}
    steps:
      - id: out
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "rpc_url=${{ vars.TESTNET_RPC_URL }}" >> "$GITHUB_OUTPUT"
            echo "api_url=${{ vars.TESTNET_API_URL }}" >> "$GITHUB_OUTPUT"
            echo "ws_url=${{ vars.TESTNET_WS_URL }}" >> "$GITHUB_OUTPUT"
            echo "chain_id=${{ vars.TESTNET_CHAIN_ID }}" >> "$GITHUB_OUTPUT"
            echo "contract_account=${{ vars.TESTNET_CONTRACT_ACCOUNT }}" >> "$GITHUB_OUTPUT"
            echo "swap_contract=${{ vars.TESTNET_SWAP_CONTRACT }}" >> "$GITHUB_OUTPUT"
            echo "env_name=testnet" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            echo "rpc_url=${{ secrets.PROD_RPC_URL }}" >> "$GITHUB_OUTPUT"
            echo "api_url=${{ secrets.PROD_API_URL }}" >> "$GITHUB_OUTPUT"
            echo "ws_url=${{ secrets.PROD_WS_URL }}" >> "$GITHUB_OUTPUT"
            echo "chain_id=${{ secrets.PROD_CHAIN_ID }}" >> "$GITHUB_OUTPUT"
            echo "contract_account=${{ secrets.PROD_CONTRACT_ACCOUNT }}" >> "$GITHUB_OUTPUT"
            echo "swap_contract=${{ secrets.PROD_SWAP_CONTRACT }}" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - api-gateway
          - worker-game-loop
          - oracle-daemon
          - frontend
          - swap-ui
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker Tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE="${{ env.IMAGE_NS }}/cryptobingo-${{ matrix.app }}"
          REF="${{ github.ref_name }}"
          if [ "$REF" = "develop" ]; then
            echo "tags=${BASE}:testnet-${SHA},${BASE}:testnet" >> "$GITHUB_OUTPUT"
          elif [ "$REF" = "master" ]; then
            echo "tags=${BASE}:stable-${SHA},${BASE}:stable" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${BASE}:pr-${SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_RPC_URL=${{ needs.resolve-env.outputs.rpc_url }}
            VITE_API_GATEWAY_URL=${{ needs.resolve-env.outputs.api_url }}
            VITE_WS_URL=${{ needs.resolve-env.outputs.ws_url }}
            VITE_CHAIN_ID=${{ needs.resolve-env.outputs.chain_id }}
            VITE_CONTRACT_ACCOUNT=${{ needs.resolve-env.outputs.contract_account }}
            VITE_WAX_RPC_URL=${{ needs.resolve-env.outputs.rpc_url }}
            VITE_GAME_URL=${{ needs.resolve-env.outputs.ws_url }}
            VITE_SWAP_CONTRACT=${{ needs.resolve-env.outputs.swap_contract }}

  deploy-testnet:
    needs: [resolve-env, build]
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute SHA
        id: vars
        run: echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ── API Gateway ──────────────────────────────────────────────
      - name: Deploy API Gateway
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              -g ${{ env.AZURE_RG }} \
              -n api-gateway \
              --container-name api-gateway \
              --image ${{ env.IMAGE_NS }}/cryptobingo-api-gateway:testnet \
              --set-env-vars APPLICATIONINSIGHTS_CONNECTION_STRING=${{ secrets.APPINSIGHTS_CS }} APPLICATIONINSIGHTS_SAMPLING_RATIO=0.2 APPLICATIONINSIGHTS_ENABLED=true

      # ── Worker ───────────────────────────────────────────────────
      - name: Deploy Worker
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              -g ${{ env.AZURE_RG }} \
              -n worker-game-loop \
              --container-name worker-game-loop \
              --image ${{ env.IMAGE_NS }}/cryptobingo-worker-game-loop:testnet \
              --set-env-vars APPLICATIONINSIGHTS_CONNECTION_STRING=${{ secrets.APPINSIGHTS_CS }} APPLICATIONINSIGHTS_SAMPLING_RATIO=0.1 APPLICATIONINSIGHTS_ENABLED=true

      # ── Oracle Daemon ───────────────────────────────────────────────
      - name: Deploy Oracle Daemon
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              -g ${{ env.AZURE_RG }} \
              -n oracle-daemon \
              --container-name oracle-daemon \
              --image ${{ env.IMAGE_NS }}/cryptobingo-oracle-daemon:testnet \
              --set-env-vars \
                RPC_URL=${{ needs.resolve-env.outputs.rpc_url }} \
                CHAIN_ID=${{ needs.resolve-env.outputs.chain_id }} \
                ORNG_ACCOUNT=bingogamerng \
                ORNG_POLL_INTERVAL_MS=2000 \
                ORNG_WAX_KEY=secretref:orng-wax-key \
                ORNG_RSA_PRIVATE_KEY=secretref:orng-rsa-key \
                APPLICATIONINSIGHTS_CONNECTION_STRING=${{ secrets.APPINSIGHTS_CS }} \
                APPLICATIONINSIGHTS_ENABLED=true

      # ── Frontend (Static Web App) ────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Build Frontend
        run: pnpm --filter @cryptobingo/frontend build
        env:
          VITE_RPC_URL: ${{ needs.resolve-env.outputs.rpc_url }}
          VITE_API_GATEWAY_URL: ${{ needs.resolve-env.outputs.api_url }}
          VITE_WS_URL: ${{ needs.resolve-env.outputs.ws_url }}
          VITE_CHAIN_ID: ${{ needs.resolve-env.outputs.chain_id }}
          VITE_CONTRACT_ACCOUNT: ${{ needs.resolve-env.outputs.contract_account }}
          VITE_WAX_RPC_URL: ${{ needs.resolve-env.outputs.rpc_url }}
          VITE_GAME_URL: ${{ needs.resolve-env.outputs.ws_url }}
          VITE_SWAP_CONTRACT: ${{ needs.resolve-env.outputs.swap_contract }}

      - name: Deploy Frontend (SWA)
        run: |
          npx -y @azure/static-web-apps-cli deploy \
            apps/frontend/dist \
            --deployment-token "${{ secrets.SWA_DEPLOY_TOKEN_FRONTEND }}" \
            --env production \
            --app-location apps/frontend/dist

      # ── Swap-UI (Static Web App) ──────────────────────────────────
      - name: Build Swap-UI
        run: pnpm --filter @cryptobingo/swap-ui build
        env:
          VITE_RPC_URL: ${{ needs.resolve-env.outputs.rpc_url }}
          VITE_API_GATEWAY_URL: ${{ needs.resolve-env.outputs.api_url }}
          VITE_WS_URL: ${{ needs.resolve-env.outputs.ws_url }}
          VITE_CHAIN_ID: ${{ needs.resolve-env.outputs.chain_id }}
          VITE_CONTRACT_ACCOUNT: ${{ needs.resolve-env.outputs.contract_account }}
          VITE_WAX_RPC_URL: ${{ needs.resolve-env.outputs.rpc_url }}
          VITE_GAME_URL: ${{ needs.resolve-env.outputs.ws_url }}
          VITE_SWAP_CONTRACT: ${{ needs.resolve-env.outputs.swap_contract }}

      - name: Deploy Swap-UI (SWA)
        run: |
          npx -y @azure/static-web-apps-cli deploy \
            apps/swap-ui/dist \
            --deployment-token "${{ secrets.SWA_DEPLOY_TOKEN_SWAP_UI }}" \
            --env production \
            --app-location apps/swap-ui/dist

  smoke-test:
    needs: deploy-testnet
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Health Check
        run: |
          URL="https://api-gateway.ambitioussand-97811f02.westus.azurecontainerapps.io"
          for i in $(seq 1 12); do
            LIVE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health/live" || true)
            READY=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health/ready" || true)
            if [ "$LIVE" = "200" ] && [ "$READY" = "200" ]; then
              echo "✅ API Gateway: live=$LIVE ready=$READY"
              break
            fi
            echo "⏳ tentativa $i: live=$LIVE ready=$READY"
            sleep 10
          done
          [ "$LIVE" = "200" ] && [ "$READY" = "200" ]

      - name: k6 Smoke Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/smoke.js
          flags: --env API_URL=https://api-gateway.ambitioussand-97811f02.westus.azurecontainerapps.io
