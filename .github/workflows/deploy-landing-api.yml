name: Deploy Landing API

on:
  push:
    branches: [develop, master]
    paths:
      - 'apps/landing-page/api/**'
      - '.github/workflows/deploy-landing-api.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing-page/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compilar TS → CJS
        run: npx tsc

      - name: Montar pacote (npm install limpo — pnpm symlinks corrompem zip)
        run: |
          rm -rf /tmp/fa-prod
          mkdir -p /tmp/fa-prod
          cd /tmp/fa-prod
          jq '{name,version,main,dependencies}' ${{ github.workspace }}/apps/landing-page/api/package.json > package.json
          npm install
          mkdir -p _lib ideas votes admin
          cp ${{ github.workspace }}/apps/landing-page/api/{host.json,index.js,stats.js,stats_game.js,subscribe.js} ./
          cp ${{ github.workspace }}/apps/landing-page/api/_lib/*.js _lib/
          cp ${{ github.workspace }}/apps/landing-page/api/ideas/*.js ideas/
          cp ${{ github.workspace }}/apps/landing-page/api/votes/*.js votes/
          cp ${{ github.workspace }}/apps/landing-page/api/admin/*.js admin/
          zip -r /tmp/fa-prod.zip .

      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy Azure Function App
        run: |
          az webapp deployment source config-zip \
            --name cryptobingo-landing-api \
            --resource-group cryptobingo-testnet \
            --src /tmp/fa-prod.zip
